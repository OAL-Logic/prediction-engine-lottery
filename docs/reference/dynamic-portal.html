## 4. 6-Formula Deterministic Predictor & Backtest Verifier

```python
def run_six_formula_predictors(
    draws: list[list[int]],
    pool_max: int = 60,
    depth: int = 10,
    offset: int = 0,
) -> dict[int, list[int]]:
    \"\"\"
    Clean-room implementation of the 6 deterministic formula predictors over a sliding draw window.
    \"\"\"
    window = draws[max(0, len(draws) - depth - offset) : len(draws) - offset]
    if not window:
        return {i: [] for i in range(1, 7)}
    k = len(window[0])
    last_draw = window[-1]
    prev_draw = window[-2] if len(window) >= 2 else last_draw

    # Formula 1: Modular pair-sum projection
    f1 = sorted({((a + b - 1) % pool_max) + 1 for a, b in zip(last_draw, prev_draw)})
    # Formula 2: Mirror complement (M + 1 - n) + adjacent step
    f2 = sorted({((pool_max + 1 - n + idx) % pool_max) + 1 for idx, n in enumerate(last_draw, 1)})
    # Formula 3: Positional floor average across depth window
    f3 = sorted({(sum(d[pos] for d in window) // len(window)) for pos in range(k)})
    # Formula 4: Golden-step skip-weighted harmonic projection
    f4 = sorted({((n * 3 + sum(last_draw)) % pool_max) + 1 for n in last_draw})
    # Formula 5: Delta-extrapolation (2 * last - prev) mod M
    f5 = sorted({((2 * a - b - 1) % pool_max) + 1 for a, b in zip(last_draw, prev_draw)})
    # Formula 6: Consensus frequency + overdue skip intersection
    counts = {n: sum(1 for d in window if n in d) for n in range(1, pool_max + 1)}
    f6 = sorted(sorted(range(1, pool_max + 1), key=lambda n: (-counts[n], n))[: max(k * 2, 12)])

    return {1: f1, 2: f2, 3: f3, 4: f4, 5: f5, 6: f6}
```

### 3.2 Flat Historical Draw Files (`data/drawings/*.Txt`)

Plain-text UTF-8/ASCII files where each line represents one historical drawing.

**Format Grammar**:
```text

```

**Concrete Examples**:
```text

05/02/2026	04 15 23 38 42 59

# 5/69 + 1/26 Double-Drum Lotto (Powerball style)

### 3.3 Serialized Filter Rule Wire Format (`||$[[][][]]` Grammar)

In classical lottery studio preset files (`.flt` / `.ini`), a filter pipeline is persisted as a single deterministic text string using hierarchical delimiters:

```text
<Group1>||<Group2>||...||<GroupM>
```

Each `<Group>` encodes its category header and rule list:
```text
<GroupID>:<Enabled>:<GroupMinPass>:<GroupMaxPass>$[<Rule_1>][<Rule_2>]...[<Rule_R>]
```

Each `<Rule_i>` inside brackets `[...]` encodes:
```text
<FilterTag>,<EnabledFlag>,<ActionMode>,<MinBound>,<MaxBound>,<PosMask>,<SetPayload>
```

| Token | Type | Meaning |
| :--- | :--- | :--- |
| `FilterTag` | `int (1..105)` | Unique numeric identifier of the filter algorithm (see `filters-catalog.csv`) |
| `EnabledFlag` | `0 \| 1` | `1` if active in current funnel execution, `0` if bypassed |
| `ActionMode` | `0 \| 1` | `0 = Accept` (keep if within `[Min, Max]`), `1 = Reject` (discard if within `[Min, Max]`) |
| `MinBound` | `int` | Lower inclusive bound for the filter metric |
| `MaxBound` | `int` | Upper inclusive bound for the filter metric |
| `PosMask` | `str` | Bitmask of active ball positions (e.g., `\"111111\"` for all 6 positions) |
| `SetPayload` | `str` | Semicolon-separated ball list for Custom Number Set filters (e.g., `\"01;05;12;19;23\"`) |

## 5. In-Memory Data Structures & Tensor Shapes (Python Boilerplate)

During high-throughput ticket generation, filtering ($>500,000\text{ tickets/sec}$), and skip-matrix computation, data is held in contiguous NumPy arrays and typed dataclasses:

```python
from __future__ import annotations
from dataclasses import dataclass, field
from datetime import date
from typing import Dict, List, Optional, Tuple
import numpy as np


@dataclass(frozen=True)
class GameSpec:
    \"\"\"Immutable descriptor for any Pick-N, Keno, or Digit lottery game.\"\"\"
    game_id: str
    name: str
    pool_main: int          # N: e.g. 60 for Mega-Sena, 69 for Powerball
    pick_main: int          # K: e.g. 6 for Mega-Sena, 5 for Powerball
    pool_bonus: int = 0     # M: e.g. 26 for Powerball, 0 if none
    pick_bonus: int = 0     # B: e.g. 1 for Powerball, 0 if none
    base_number: int = 1    # 1 for standard Lotto, 0 for Pick-3/4


@dataclass(frozen=True)
class DrawRecord:
    \"\"\"Single historical drawing record.\"\"\"
    draw_id: int
    draw_date: date
    main_balls: Tuple[int, ...]
    bonus_balls: Tuple[int, ...] = ()


@dataclass
classFilterConditionNode:
    \"\"\"Single node in the 69/105-vector combinatorial filter graph.\"\"\"
    tag_id: int
    name: str
    category: str
    enabled: bool = True
    reject_mode: bool = False
    min_val: int = 0
    max_val: int = 999
    position_mask: Tuple[bool, ...] = field(default_factory=lambda: (True,) * 6)
    custom_set: Tuple[int, ...] = ()


@dataclass
class AnalyticalMatrixBundle:
    \"\"\"
    Contiguous in-memory tensors used by the analysis, skips, and filter engines.
    Let T = number of historical draws, K = pick_main, N = pool_main, C = candidate tickets.
    \"\"\"
    # Shape: (T, K), dtype=int16 — sorted ascending main numbers per draw
    draws_matrix: np.ndarray

    # Shape: (T, N + 1), dtype=bool — 1-hot incidence matrix (incidence[t, b] == True if ball b hit in draw t)
    incidence_matrix: np.ndarray

    # Shape: (T, N + 1), dtype=int16 — Actual Skips matrix (draws elapsed since ball b last hit at draw t)
    actual_skips_matrix: np.ndarray

    # Shape: (T, 28), dtype=int32 — Precomputed 28 structural metrics per historical draw
    metrics_matrix: np.ndarray

    # Shape: (C, K), dtype=int16 — Candidate ticket pool in Ticket Store for vectorized filtering
    candidate_tickets: Optional[np.ndarray] = None

    @classmethod
    def from_draws(cls, draws: List[DrawRecord], spec: GameSpec) -> \"AnalyticalMatrixBundle\":
        t_count = len(draws)
        k = spec.pick_main
        n = spec.pool_main

        draws_mat = np.zeros((t_count, k), dtype=np.int16)
        incidence = np.zeros((t_count, n + 1), dtype=bool)
        skips = np.zeros((t_count, n + 1), dtype=np.int16)

        running_age = np.zeros(n + 1, dtype=np.int16)
        for t, d in enumerate(draws):
            row = sorted(d.main_balls)
            draws_mat[t, :] = row
            incidence[t, row] = True
            skips[t, :] = running_age
            running_age += 1
            running_age[row] = 0

        metrics = np.zeros((t_count, 28), dtype=np.int32)
        if t_count > 0:
            # Column 0: Sum, Column 1: Sum Tail, Column 2: Floor Avg, Column 3: Spread
            metrics[:, 0] = draws_mat.sum(axis=1)
            metrics[:, 1] = metrics[:, 0] % 10
            metrics[:, 2] = metrics[:, 0] // k
            metrics[:, 3] = draws_mat[:, -1] - draws_mat[:, 0]
            # Column 4: Odd count
            metrics[:, 4] = (draws_mat % 2 == 1).sum(axis=1)

        return cls(
            draws_matrix=draws_mat,
            incidence_matrix=incidence,
            actual_skips_matrix=skips,
            metrics_matrix=metrics,
        )
```

---

## 6. Filter Catalog Vector Map (Tags `01` – `69`)

| Tag Range | Category | Key Data Structures Operated On |
| :--- | :--- | :--- |
| **`01` – `15`** | **Base Numeric Counts** | `candidate_tickets` $\cap$ static sets (`ODD`, `EVEN`, `LOW`, `HIGH`, `PRIME`, `COMPOSITE`, `FAVORITE`, `INCLUDED`, `EXCLUDED`) |
| **`016` – `31`** | **Summary & Arithmetic** | Row reductions over `candidate_tickets`: `sum`, `sum % 10`, `sum // K`, `spread`, `AC value`, `tail_groups`, `consec_pairs`, `consec_runs` |
| **`32` – `39`** | **Historical & Positional** | Cross-draw comparisons against `draws_matrix[-1:-10]` (`repeat_prev_k`, `adjacent_prev_1`, positional `[min, max]` bounds, historical jackpot match) |
| **`40` – `52`** | **Skip & Gap Dynamics** | Lookups into `actual_skips_matrix[-1, ticket]`: skip sum, max skip, min skip, skip tail distribution (`0..9`), and decade load buckets |
| **`53` – `69`** | **Custom Sets & Matrix Masks** | User-defined groups $S_1 \dots S_{12}$ (`SetPayload` bitmasks), pairwise difference bounds, and modulo residue classes |

## 7. Classical Studio Per-Game State & Binary File Map

A classical desktop lottery studio persists global and per-game workspace state across two relational database containers (`MainData.db` / `FiltersData.db`), global `.ini` files, per-game workspace folders, and binary wheeling catalogs:

### 7.1 Workspace & Per-Game Directory Structure

```text
<StudioRoot>/
├── Lottery_Set.ini                  # Active game descriptor & catalog cursor
├── Current_Set.ini                  # Global UI, grid typography, & session state
├── Data/
│   ├── MainData.db                  # Master game catalog, active drawing table, & statistical caches
│   ├── FiltersData.db               # 69-vector filter catalog metadata & user filter presets
│   └── Tickets.Txt                  # Default scratchpad ticket buffer
├── Formula/
│   └── <KK>-<VV>-<T>-<M>.Wheels     # Binary covering designs (8-byte blocks per wheel line)
└── <GameName>/                      # Per-game workspace directory (e.g., \"Brazil Mega Sena/\")
    ├── Current_Set.ini              # Game-specific UI cursor, draw range, & predictor settings
    ├── Tickets.Txt                  # Active generated/filtered tickets for this game
    ├── search_list.sl               # Pre-enumerated k-tuple search combinations (e.g. C(60,3) = 34,220 lines)
    └── Num_Dis_Next.nxt             # ASCII report buffer for next-draw follower/distance distribution
```

---

### 7.2 Configuration & State INI Schemas

#### `Lottery_Set.ini` (Active Game Pointer)
```ini
[PlayLottery]
LotteryName=Brazil Mega Sena
From=60                              ; Pool size (N)
Match=6                              ; Pick count (K)
Bouns=0                              ; Bonus pool size (M)
LotteryFile=Brazil_Mega-Sena.Txt     ; Source flat file in Drawings/
BounsCount=0                         ; Bonus balls drawn (B)
BounsName=                           ; Label for bonus ball (e.g. \"Powerball\")

[SelectForm]
Group=1                              ; Game category (1=Lotto, 2=Keno, 3=Digit)
State=7                              ; Country/Region group index
RecNo=1                              ; Cursor row in GameList table
```

#### `<GameName>/Current_Set.ini` (Per-Game Session State)
| Section | Key | Type | Purpose |
| :--- | :--- | :--- | :--- |
| `[LotteryParam]` | `DraingsIndex` | `int` | Latest draw row index in active history |
| `[LotteryParam]` | `DraingsIndex1` / `DraingsIndex2` | `int` | Start and end draw indices for statistical window (e.g. `2983..3002` = 20 draws) |
| `[LotteryParam]` | `FormulaIndex` / `ForWIndex` | `int` | Selected wheeling matrix index and wheeling mode |
| `[LotteryParam]` | `RightCountValue` | `str` | Logical operator across filter groups (`\"AND\"` or `\"OR\"`) |
| `[LotteryParam]` | `algorithmRzComboBox` | `int` | Selected prediction algorithm (`0..2` = Markov, Distance, Interval) |
| `[LotteryParam]` | `formulaComboBox` | `int` | Selected prediction formula (`0..5` = Formulas 1..6) |
| `[LotteryParam]` | `deepRzComboBox` / `Run` | `int` | Historical lookback depth and backtest verification horizon |
| `[LotteryParam]` | `searchOPCheckGroup` / `fromOPCheckGroup` / `toOPCheckGroup` | `int` | Ticket Optimizer (TopForm) overlap reduction bounds |
| `[GenActivePageIndex]` | `PageIndex` | `int` | Active generator tab (`0=Full/Filtered`, `1=Wheeling`, `2=Position`, `3=Random`) |
| `[Position]` | `Position 1` .. `Position 8` | `str` | Space-separated candidate balls per sorted ticket position |
| `[bounCheckBox]` | `bounposCheckBox` / `ranbouCheckBox` | `0\|1` | Bonus ball attachment mode (`all`, `random`, or `included`) |
| `[Multi-Number Combination of Stat]` | `nsRadioButton1..3` / `onlyCheckBox` | `0\|1` | Multi-number tuple size (`Pairs=2`, `Triplets=3`, `Quads=4`) |
| `[AddSelect]` / `[Select]` | `AddNumbers` / `SelectNumbers` | `str` | Space-separated favorite/selected pool balls |
| `[Search]` | `SearchIndex` / `SearchIndexFrom` / `SearchIndexTo` | `int` | Pattern Search (`nsSearch`) match threshold and draw range |

---

### 7.3 Auxiliary Per-Game Files (`search_list.sl`, `Num_Dis_Next.nxt`, `*.Wheels`)

1. **`<GameName>/search_list.sl` (Enumerated $m$-Tuple Lookup Buffer)**
   - Fixed-width ASCII lines (`\r\n` terminated) storing all $\binom{N}{m}$ combinations for Multi-Number Statistics (`nsStat`).
   - Example for $N=60, m=3$: $\binom{60}{3} = 34,220$ lines $\times 10\text{ bytes} = 342,200\text{ bytes}$:
     ```text
     01 02 03\r\n
     01 02 04\r\n
     ...
     58 59 60\r\n
     ```

2. **`Formula/<KK>-<VV>-<T>-<M>.Wheels` (Abbreviated Covering Matrix Files)**
   - Filename grammar:
     - `KK`: Ticket size $K$ (`02` to `10`)
     - `VV`: Wheeled pool size $V$ (`03` to `38`)
     - `T`: Minimum guaranteed prize match $T$ (`2` to `7`)
     - `M`: Minimum drawn winners in pool $M$ (`1` to `7`)
   - Record layout: Each covering ticket template is stored as an **8-byte block** (`file_size / 8 = total wheel lines`). For example, `06-08-4-4.Wheels` is `64 bytes` $= 8$ covering tickets of 6 indices drawn from an 8-number pool $\{1 \dots 8\}$.

3. **`Data/MainData.db` & `Data/FiltersData.db` Relational Tables**

| Container | Table Name | Key Columns | Purpose |
| :--- | :--- | :--- | :--- |
| `MainData.db` | `GameList` | `ID`, `GroupID`, `Country`, `LotteryName`, `TotalBalls`, `PickBalls`, `BonusBalls`, `BonusCount`, `FileName` | Master catalog of 222+ supported lotteries |
| `MainData.db` | `Drawings` | `IndexNo`, `DrawDate`, `N1..N20`, `B1..B2`, `Sum`, `Avg`, `OddEven`, `LowHigh`, `AC`, `Spread`, `Repeat1..3` | Active game historical draws + 28 precomputed metrics |
| `MainData.db` | `ActualSkips` | `IndexNo`, `DrawDate`, `Ball_01 .. Ball_80`, `SkipSum`, `SkipAvg`, `SkipTail0..9` | Full skip matrix across all balls in the active pool |
| `FiltersData.db` | `FilterCatalog` | `FilterTag (1..69)`, `CategoryID`, `FilterName`, `DefaultMin`, `DefaultMax`, `SupportsPosMask` | Static metadata for the 69-vector filter engine |
| `FiltersData.db` | `SavedFilterSets` | `SetID`, `LotteryName`, `SetName`, `SerializedRules` (`||$[[][][]]`) | User-saved filter configurations per lottery |

One canonical term per concept, its definition, and the authoritative source.
Grounded in the validated math (doc 10) and real schema (doc 09). Use these names
consistently in docs and any rebuild.

> **Naming decisions for you to confirm** (I picked a default; change if you prefer):
> 1. **Combination** vs *Line* vs *Ticket* — I use **Combination** for a set of
>    numbers and **Ticket** only for a combination staged to play. ✎
> 2. **Draw** vs *Drawing* — I use **Draw** (noun) / **Drawings** (the history
>    collection), matching the app's toolbar. ✎
> 3. **Recommended pool** for the predictor's output (vs *prediction numbers*). ✎
> 4. **Pool max (M)** for the largest number (vs *From*, the DB column name). ✎

---

## Core objects
| Canonical term | Definition | Source / aliases |
|---|---|---|
| **Game** | A lottery configured by pick size, pool max, and optional bonus. | `Lottery`; DB `Lottery` table |
| **Pick (k)** | How many main numbers are drawn (2–9). | DB `Match`; manual \"pick 2…9\" |
| **Pool max (M)** | Largest selectable number (pool is `1..M`, up to 90). | DB `From` |
| **Bonus** | Extra/supplementary number(s) drawn from a separate pool of size `PB_Max`. | DB `Bouns`/`PB_Max`; code misspells \"Bouns\" |
| **Draw** | One dated result: `k` main numbers (+ bonus). | `Drawing`; DB `Draw`/`Draings` (sic) |
| **Drawings** | The historical collection of draws for a game (a `.Txt` file). | `Drawings/*.Txt` |
| **Combination** | An unordered set of `k` numbers from the pool. | *line*, *combo* |
| **Ticket** | A combination staged to play; may carry a **tag**. | `Tickets` table/store |
| **Ticket store** | The working list of tickets (right panel). | `Tickets.Txt` |
| **Tag** | Per-ticket mark (`X` or blank) for bulk keep/delete. | doc 01 F4 |

## Skips & frequency
| Term | Definition |
|---|---|
| **Hit** | A pattern/number occurring in a draw. |
| **Actual Skips** | The sequence of gap lengths between successive hits of a pattern. |
| **Average Skips** | Mean of the Actual-Skips sequence (`Σ gaps / #gaps`). |
| **Now Skips** | Draws since the pattern last hit. `Now > Average` ⇒ \"due\". |
| **Hot / Cold / Warm number** | Most-hit / least-hit / in-between numbers over a chosen range. |

## Combination metrics (all ✅ validated, doc 10)
| Term | Definition (canonical) |
|---|---|
| **AC** (Arithmetic Complexity) | `#{distinct pairwise differences} − (k−1)`. |
| **Sum** | Σ of the numbers. |
| **Average Value** | `Σ // k` (integer **floor** division). |
| **Root Sum** | **Single** digit-sum pass of the total (e.g. 257 → 14); *not* an iterated digital root. |
| **Odd / Even Count / Sum** | Count/sum of odd (even) numbers. |
| **Low / High** | Split at `⌊M/2⌋`: low = `1..⌊M/2⌋`, high = the rest. |
| **Prime** | Count/sum of prime numbers (2 counts). |
| **Decade** | A block of ten by value: `⌊n/10⌋` (0–9, 10–19, …) — **fixed tens**. |
| **Decade Group Count** | # of adjacency groups among the distinct decades present. |
| **Different Decade Count** | # of distinct decades present. |
| **Divided (remainder)** | Partition of the pool by `n mod D` (D = 3…10); count per remainder. | 
| **Modality** | The concatenated per-group counts (e.g. Odd/Even `00101`, Divided `311`). |
| **Multiple** | Assign each number to the first of 7→5→3→2→1 it divides by (priority); count per bucket. |
| **Distance** | Adjacent **absolute** differences **in draw order**: Max / Average(`//`) / Different(distinct). |
| **First-Last Distance** | `max − min` (sort-invariant). |
| **Successive** | Longest run of **draw-order-adjacent** consecutive integers, `0` if length <2. |
| **Successive Groups** | # of such runs of length ≥2. |
| **Odd / Even Successive** | Longest run of draw-order-adjacent odd (even) numbers, ≥2 else 0. |

## Digit / unit terms (✅ validated, doc 10)
| Term | Definition |
|---|---|
| **First digit** | Tens digit `⌊n/10⌋` (0 for `n<10`). |
| **Second / End unit** | Ones digit `n % 10`. |
| **Unit Number Sum** | Σ of second digits. |
| **Successive End Units** | Longest run of consecutive **distinct second digits**, 0 if <2. |
| **Same End Units with Last Drawn** | Size of the **distinct** second-digit intersection with the prior draw. |
| **InterChangeable Units Count** | Numbers whose digit-swap is `≤ M` and not a palindrome. |
| **Unit Number Group Count** | # adjacency groups among the distinct second digits. |

## Filtering
| Term | Definition |
|---|---|
| **Filter** | A predicate over a combination; failing lines are removed. |
| **Filter tag** | Stable filter id 1–69 (`Condition_Tag`). |
| **Filter engine type** | 1 = base (scalar range), 2–4 = advanced (bundle / set / special). |
| **Condition (parameter)** | A filter's allowed range/set (e.g. `1-5`). |
| **Auto-generate default condition** | Fill a filter's range from history (prev 2/3/5/10/20/30/50/current). |
| **Logical condition** | How selected filters combine: **AND** / **OR** / **N-of-M** (fault-tolerant). |
| **Fault tolerance** | The N-of-M mode; pass if N…M of the filters match (guards the jackpot line). |
| **Filter assistant** | Per-filter frequency + trend charts for setting parameters. |
| **Filtering report** | Per-filter count of lines removed. |

## Wheeling
| Term | Definition |
|---|---|
| **Wheel** | A covering design turning `n` chosen numbers into multiple `k`-lines. |
| **Full wheel** | All `C(n,k)` lines. |
| **Abbreviated wheel** | Minimal line set meeting a stated match **guarantee**. |
| **Guarantee** | \"If X of the `k` winners are among your `n`, ≥1 line matches Y.\" |
| **Wheel size (n)** | How many numbers are wheeled (≤ 36). |
| **Letter map** | The wheel formula expressed as letter-combos, instantiated by substituting numbers. |

## Prediction
| Term | Definition |
|---|---|
| **Formula** | One of `Formula-1 … Formula-6`, a prediction strategy (+ algorithm/offset/depth). |
| **Recommended pool** | The predictor's output set of numbers (~17–27); play/wheel from it. |
| **Eliminated** | Numbers the predictor rules out. |
| **Verification** | Replay a formula over history; measure winners falling in the recommended pool. |
| **Hit-rate** | `Σ correctCount / Σ winning numbers` over a verification range. |
| **Drawings Trend** | Manual, chart-driven next-draw prediction. |

## Generation, optimization, search, checking
| Term | Definition |
|---|---|
| **Full generator** | Produce all `C(pool, k)` combinations. |
| **Wheel generator** | Produce a wheel's lines from the selected pool. |
| **Positional** | Cross-product of a chosen number set per position. |
| **Random / Smart** | Random lines / analysis-depth-weighted random lines. |
| **Quick pick** | One-click hot / cold / last-N number selection. |
| **Optimization** | Cost-reduction of the ticket set: same-number reduction, or reserve-X-per-10. |
| **Search (past drawings)** | Frequency/skips of 1/2/3-number combinations across history. |
| **Check winning** | Match tickets against a draw by `=,>,<,≥,≤` a match count (bonus-aware). |

---

## Spelling normalizations (app/code → canonical)
`Bouns` → **Bonus** · `Draings`/`Draings` → **Draw/Drawings** · `perdiction`/`Perdiction`
→ **Prediction** · `Successiv` → **Successive** · `BigSmall` (table) → **Low/High** ·
`Residue` (table) → **Divided** · `BeforeDrawings`/`Before` → **Previous/Prior Draw** ·
`ComprehensiveAnalyze` → **Base analysis** · `ns…` tables → **Search**.

**Role framing:** written as your Chief System Architect. This is not a framework
or a skeleton — it is the complete set of epics, features, user stories, module
designs, **exact build prompts**, quality gates, and a maintenance protocol needed
to rebuild Lottery Studio to feature parity, starting today.

It stands on a **verified** foundation: every statistic and filter in this spec was
validated against the original app's own computed values (see `../Documentation/10-Validation-Report.md`).
Where this spec states a formula, it is the proven one.

---

## How to use this spec

1. Read `01-project-structure.md` — the module map and the context for every major
   function.
2. Read `02-conventions.md` — the **prompt template**, **quality-gate template**,
   Definition of Done, and test strategy. Every feature chain below reuses these.
3. Build in the order of `90-build-order.md`. For each feature, open its epic file
   and run its **workflow chain**: each stage has a ready-to-paste prompt; the chain
   ends with a quality gate you must pass before moving on.
4. Keep the system current with `99-maintenance-protocol.md` (weekly).

Each **feature** in an epic file is fully self-contained:
> Epic → Feature → *User stories* → *Module design (interface/seam)* →
> *Workflow chain (staged prompts)* → *Quality gate*.

---

## The product in one paragraph

A cross-platform desktop app for analysing number-draw (\"lotto-type\") lotteries.
It maintains a historical results database for 200+ games, runs 18 statistical
methods over that history, generates candidate tickets (random / positional /
full / wheeled), filters them with 69 configurable filters, reduces the survivors
with wheels and optimization, predicts a next-draw recommended pool with
verifiable formulas, and checks tickets against results. Verified reference:
`../Documentation/`.

---

## Stack decision (concrete, so prompts are concrete)

> \"Don't give me a framework\" = don't hand-wave. So we commit to a concrete stack.
> The **domain core is framework-agnostic**, so the shell is swappable later.

| Layer | Choice | Why |
|---|---|---|
| Language | **TypeScript** (strict) | The validated math ports 1:1; one language across core, app, UI; huge test tooling. |
| Domain core | **`packages/core`** — pure TS, zero I/O, zero UI | The crown jewel (all math); 100% unit-tested through its interfaces. |
| Application layer | **`packages/app`** — use-cases orchestrating core + data | Framework-agnostic; the UI calls this, never core internals. |
| Data adapters | **`packages/data`** — repositories, exporters, update client | Implements interfaces *defined by* core/app (dependency inversion). |
| Desktop shell | **Tauri** (Rust) + **React** + TS (`apps/desktop`) | Small binary, native file access; Electron is a drop-in alt. |
| Tests | **Vitest** (unit/integration), **Playwright** (e2e UI) | Fast, TS-native. |
| Charts | **Reusable chart components** (see `01`) | Frequency + trend charts appear everywhere. |
| Monorepo | **pnpm workspaces** + **Turborepo** | Clean package graph, cached builds. |

If you prefer Electron, or a Python/Qt core, the epics still apply verbatim — only
the Stage-1 scaffold prompt changes. Everything downstream is behavior, not stack.

The structure encodes the architecture from `../Documentation/07`: a **pure domain
core** wrapped by an application layer, fed by swappable data adapters, presented by
a desktop shell. Design vocabulary follows `/codebase-design`: we build **deep
modules** — a lot of behavior behind a small interface, testable through that
interface.

## Monorepo layout

```
Lottery Studio/
├── package.json                 # pnpm workspace root
├── pnpm-workspace.yaml
├── turbo.json
├── packages/
│   ├── core/                    # PURE domain — no I/O, no UI, no framework
│   │   ├── src/
│   │   │   ├── game/            # Game, DrawHistory, Combination value types
│   │   │   ├── stats/           # StatisticsEngine + SkipsEngine
│   │   │   ├── filters/         # FilterEngine + 69 filter definitions
│   │   │   ├── wheels/          # WheelLibrary (covering designs)
│   │   │   ├── generation/      # GenerationEngine
│   │   │   ├── predict/         # Predictor + Verifier
│   │   │   ├── tickets/         # TicketSet, Optimizer, Searcher, WinChecker
│   │   │   └── index.ts         # the package's public interface (barrel)
│   │   └── test/                # Vitest unit tests (mirror src/)
│   ├── app/                     # use-cases; orchestrates core + data ports
│   │   └── src/usecases/        # one file per user story action
│   ├── data/                    # adapters implementing core/app ports
│   │   └── src/
│   │       ├── results/         # ResultsRepository (txt/json/mdb-import)
│   │       ├── catalog/         # GameCatalog (games-catalog.csv seed)
│   │       ├── settings/        # SettingsStore
│   │       ├── update/          # OnlineUpdateClient
│   │       └── export/          # Exporters (txt/html/xlsx/print)
│   └── ui/                      # reusable presentation components (React)
│       └── src/components/      # NumberGrid, FrequencyChart, TrendChart, ...
├── apps/
│   └── desktop/                 # Tauri + React shell; wires ui → app → data
│       ├── src-tauri/           # Rust shell (file dialogs, fs, window)
│       └── src/                 # React routes = screens S01..S47
└── fixtures/                    # seed data + validation fixtures
    ├── games-catalog.csv        # from ../Documentation/
    ├── filters-catalog.csv
    └── drawings/                # sample Drawings/*.Txt
```

## Dependency rule (enforced)

```mermaid
flowchart LR
    UI[ui / apps-desktop] --> APP[app: use-cases]
    APP --> CORE[core: pure domain]
    APP --> PORTS[ports/interfaces]
    DATA[data: adapters] -. implements .-> PORTS
    CORE --> PORTS
    classDef pure fill:#e3efe8,stroke:#16815e;
    class CORE pure
```

- **core** depends on nothing but itself and port *interfaces*. It never imports
  `data`, `ui`, Node, or Tauri.
- **data** depends on core (for types/ports) and outside I/O. UI never imports data
  directly — only `app`.
- The **seam** between app and data is dependency-inverted: core/app declare ports
  (`ResultsRepository`, `SettingsStore`, `GameCatalog`, `Exporter`,
  `UpdateClient`); data supplies adapters. Two adapters make a real seam: a
  file-based repo and an in-memory fake for tests.

## Context for every major function (deep-module map)

Each row is a deep module: small interface, large hidden behavior. \"Context\" =
where its authoritative behavior spec lives.

| Module (interface) | Responsibility (hidden behavior) | Key interface (small) | Seam / deps | Context |
|---|---|---|---|---|
| **GameCatalog** | Know all games + their rules | `list()`, `get(id)`, `create(rules)` | port → data | Doc 09 §2.1; EPIC-1 |
| **DrawHistory** | Ordered results of one game; windowing | `all()`, `window(range)`, `add/insert/modify/delete`, `splitByWeekday()` | value + ResultsRepository port | Doc 07 §4.1; EPIC-1 |
| **SkipsEngine** | Actual/Average/Now skips of any tracked value | `skips(valuesOverHistory)` | pure | Doc 02 \"Skips\"; EPIC-2 |
| **StatisticsEngine** | 18 methods over a window + position scope | `analyze(method, {range,positions})` | pure, uses SkipsEngine | Doc 02; EPIC-2 |

## Core value types (shared across modules)

```ts
type GameId = string;
interface Game { id: GameId; name: string; pick: number; maxNumber: number;
  bonus?: { count: number; maxNumber: number }; region?: string; file?: string; }
interface Draw { date: string; mains: number[]; bonus?: number[] }
interface Combination { numbers: number[]; bonus?: number[] }
interface Ticket extends Combination { tag?: 'X' | '' }   // see CONTEXT.md decision
type Range = { kind: 'prevN'; n: number } | { kind: 'dates'; from: string; to: string } | { kind: 'all' };
interface Ctx { history: Draw[]; range: Range; positions: number[]; M: number; k: number; lastDraw?: Draw }
```

> The `Ctx` object is the single source of truth passed to every metric/filter —
> build it once per screen and thread it everywhere (Doc 02, Doc 03 contract).
"}, {"id": "spec/02-conventions.md", "cat": "Clean-Room Engineering Epics", "title": "02 — Conventions: the Prompt Template, Quality Gate & Definition of Done", "md": "# 02 — Conventions: the Prompt Template, Quality Gate & Definition of Done

Every feature in every epic is built by running a **workflow chain**. Each chain is
the same five stages, and each stage has an **exact prompt** you paste into your AI
coding agent. The chain ends with a **quality gate** that must pass before the
feature is \"done.\" This file defines those reusable templates once; the epics fill
in the specifics.

---

## The five-stage workflow chain (every feature)

```mermaid
flowchart LR
    S1[1 Design<br/>interface + types] --> S2[2 Test<br/>failing specs]
    S2 --> S3[3 Implement<br/>make green]
    S3 --> S4[4 Integrate<br/>wire to app/UI]
    S4 --> S5[5 Verify<br/>drive it]
    S5 --> QG{Quality Gate}
    QG -- pass --> DONE[Done]
    QG -- fail --> S3
```

Rationale: test-first (Stage 2 before 3) gives locality and a safety net; the
interface is designed before the implementation so the module stays deep; Stage 5
drives the real behavior, not just unit tests.

---

## PROMPT TEMPLATE — paste these, filling the `{{…}}` slots

Each epic's feature gives you the filled values for `{{FEATURE}}`, `{{MODULE}}`,
`{{INTERFACE}}`, `{{BEHAVIOR}}`, `{{FIXTURES}}`, `{{ACCEPTANCE}}`. Keep the
surrounding instructions verbatim.

### Stage 1 — Design (interface + types)
```
You are building the {{MODULE}} module of the Lottery Studio core (packages/core, pure
TypeScript, strict, no I/O, no UI). Read spec/01-project-structure.md for the value
types and dependency rules.

Design the SMALL public interface for {{FEATURE}}:
{{INTERFACE}}

Rules:
- Deep module: hide {{BEHAVIOR}} behind this interface; expose nothing else.
- Pure functions: accept dependencies as args (the Ctx object), return results, no
  side effects, no globals, no Date.now()/Math.random() inside pure metrics.
- Export only through packages/core/src/index.ts.
Output ONLY: the TypeScript types + function signatures + doc comments. No
implementation bodies yet.
```

### Stage 2 — Test (failing specs from fixtures)
```
Write Vitest tests for {{FEATURE}} in packages/core/test/. Use ONLY these
verified fixtures (they come from the original app's own computed values, so they
are ground truth — do not invent expected values):
{{FIXTURES}}

Cover: the worked examples, the acceptance criteria {{ACCEPTANCE}}, and the edge
cases (empty/min-size input, bonus vs no-bonus, draw-order sensitivity where the
metric is order-dependent). The tests MUST fail now (no implementation yet). Do not
weaken a test to make it pass later.
```

### Stage 3 — Implement (make green)
```
Implement {{FEATURE}} to pass the Stage-2 tests without modifying the tests.
Follow the EXACT validated rules in {{BEHAVIOR}} (e.g. adjacency is computed in
DRAW ORDER not sorted; Average uses floor division; Root Sum is a single digit-sum
pass). Keep it inside the module; if you need a helper another module already owns
(e.g. SkipsEngine), import it — do not reimplement. Run `pnpm test` until green.
```

### Stage 4 — Integrate (wire to app + UI)
```
Expose {{FEATURE}} through a use-case in packages/app/src/usecases/ and, if it has
a screen, wire it into apps/desktop (screen {{SCREEN}}). The UI calls the use-case
only — never core internals. Add the port adapter in packages/data if persistence
or I/O is involved. Do not put domain logic in the UI or the use-case; they only
orchestrate.
```

### Stage 5 — Verify (drive the real behavior)
```
Drive {{FEATURE}} end-to-end and show it working: run the use-case against a real
fixture game (fixtures/drawings/) and print the output; if it has UI, launch the
app and exercise the flow from spec (screen {{SCREEN}}). Confirm the observed
behavior matches {{ACCEPTANCE}}. Report what you ran and the actual output — not a
claim that it \"should\" work.
```

---

## QUALITY GATE TEMPLATE — every chain ends here

A feature is **not done** until all gate checks pass. Paste this as the final step:

```
QUALITY GATE for {{FEATURE}} — all must be true; fix and re-run any that fail:
[ ] Behavior: every acceptance criterion {{ACCEPTANCE}} passes as an automated test.
[ ] Fidelity: outputs equal the verified fixtures {{FIXTURES}} exactly.
[ ] Purity: packages/core has no import of data/ui/node/tauri (grep to confirm).
[ ] Interface depth: the public surface is only {{INTERFACE}} — nothing leaked.
[ ] Tests: `pnpm test` green; coverage of this module ≥ 90% lines/branches.
[ ] Types: `pnpm typecheck` clean (strict); no `any` in the public interface.
[ ] Lint/format: `pnpm lint` clean.
[ ] Integration: the use-case runs from apps/desktop without touching core internals.
[ ] Docs: the module's doc comment links its Documentation/ source of truth.
[ ] Traceability: PR description links the feature id (e.g. F-2.3) and its epic.
Report the gate as a checked list with the command output that proves each item.
```

---

## Definition of Done (per feature)

1. Quality gate fully green.
2. Acceptance criteria (from `../Documentation/11-Acceptance-Criteria.md`) automated.
3. Merged behind a feature branch with a PR that links the epic + feature id.
4. `CONTEXT.md` updated if the feature introduced or sharpened a domain term.

## Coding standards (brief)

- TypeScript strict; no `any` at module interfaces; exhaustive `switch` on unions.
- Pure core: no I/O, no clock, no randomness inside metrics — randomness lives only
  in the generation adapter and is injected (`rng: () => number`) for deterministic tests.
- Numbers are zero-padded only at the presentation edge; the domain uses `number`.
- One module = one folder = one barrel export; tests mirror `src/`.
- Commits: `type(scope): summary` (e.g. `feat(stats): AC metric`). End commit
  messages with the Co-Authored-By trailer.

## Test strategy

- **Unit** (Vitest): every core metric/filter against verified fixtures.
- **Property** (fast-check): e.g. full-wheel size = C(n,k); filter AND ⊆ OR.
- **Integration**: use-cases against a fixture game with the in-memory repo adapter.
- **E2E** (Playwright): the core flows from `../Documentation/06`.
- **Golden fixtures**: `fixtures/` seeded from `../Documentation/` (validated values).

## The per-feature build loop (how a day looks)

1. Pick the next feature from `90-build-order.md`.
2. Run Stages 1→5 with that feature's prompts (in its epic file).
3. Pass the quality gate.
4. Merge. Update CONTEXT.md if needed. Next feature.

Keeps the rebuilt system current, correct, and buildable. Run the **weekly cycle**
every week; run the **triggered** procedures when their event fires. Each step has an
owner action and, where useful, an **exact prompt** to hand an AI agent.

---

## Weekly cycle (fixed cadence)

### Monday — Data freshness
- **Pull latest draws** for all active games via `UpdateClient`; append (dedupe).
  > Prompt: *\"Run the updateDrawings use-case for every active game. Report per game: draws added, any fetch failures, and any game whose newest draw is older than its expected cadence (flag as stale).\"*
- **Re-seed the game catalog** if any game's rules changed (pick/max/bonus) — update `fixtures/games-catalog.csv` and the catalog store.
- **Verify parity did not drift:** re-run the statistics golden tests against the newest data slice.
  > Prompt: *\"Run the statistics parity suite (fixtures/stats-golden). If any metric drops below its threshold (Units 100%, others ≥98.7%), open a bug with the failing rows and the computed-vs-expected diff. Do not weaken the test.\"*

### Tuesday — Dependency & security
- `pnpm outdated` + `pnpm audit`; bump patch/minor behind CI; hold majors for a scheduled upgrade.
  > Prompt: *\"Update all patch/minor dependencies, run typecheck/lint/test, and open a PR only if green. List held major upgrades with their changelog risk.\"*
- Rotate any adapter secrets/URLs (update sources) if used.

### Wednesday — Quality sweep
- Run the full gate across all modules: `pnpm typecheck && pnpm lint && pnpm test && pnpm test:e2e`.
- **Coverage watch:** fail the week if any core module drops below 90%.
- **Purity check:** grep `packages/core` for forbidden imports (`data|ui|node:|@tauri`).
  > Prompt: *\"Run the quality gate template (spec/02-conventions.md) across the repo. Report the checklist with command output; open issues for any red item.\"*

### Thursday — Correctness & flows
- Re-run the E2E flows (Doc 06 Flow-0…Flow-10) headless; screenshot-diff key screens.
- **Wheel integrity:** re-run the abbreviated-wheel cover check for the shipped tables (no uncovered X-subset).
- **Predictor sanity:** re-run verification for each formula over the newest range; record hit-rates in a trend log (detect regressions, not to imply the lottery is predictable).

### Friday — Docs & drift
- **Spec/code drift:** for each feature merged this week, confirm its epic entry + acceptance criteria still match the code; update the epic file if behavior changed.
- **Glossary drift:** if any new domain term appeared in code, add it to `CONTEXT.md` (per `/domain-modeling`); challenge any term that conflicts.
- **ADR check:** if a hard-to-reverse, surprising, trade-off decision was made, write an ADR in `docs/adr/`.
- Update `Documentation/` if a *behavior* (not just code) changed; keep doc 10 (validation) authoritative.

---

## Triggered procedures

| Trigger | Procedure |
|---|---|
| **A game's rules change** (operator changes pick/max/bonus) | Update catalog + `games-catalog.csv`; re-run that game's parity slice; migrate saved settings/filters if ranges shifted. |
| **A statistics parity test fails** | Treat as P1. Reproduce with the exact draw; diff computed vs golden; the *golden is truth* — fix the code, never the fixture. Cross-check the corrected rule against Doc 10. |
| **New game to add** | Run F1.3 create-game; import history (F1.5); add to catalog fixture; smoke-test analysis + generation. |
| **A new filter/metric requested** | New feature: run its 5-stage chain; register the tag; add golden fixtures; extend `filters-catalog.csv`. |
| **New wheel spec `(k,n,guarantee)`** | Generate the covering design (F5.2); run the cover check; store the JSON table; **never import proprietary `.Wheels`**. |
| **Adapter/source breaks** (update fetch 404s) | Swap the `UpdateClient` adapter; core/app untouched (the seam pays off). Add a contract test for the new source. |
| **Dependency major upgrade** | Branch; upgrade; run full gate + all E2E flows; hold if any flow regresses. |
| **Release** | Tag; run global exit criteria (`90-build-order.md`); build desktop artifacts; smoke Flow-0 on each OS. |

---

## Health dashboard (track weekly)
Keep a one-row-per-week log:

| Week | Draws added | Stale games | Parity (min %) | Coverage (min %) | E2E flows pass | Open P1 | Deps held |
|---|---|---|---|---|---|---|---|

- **Parity < threshold** or **any E2E flow red** ⇒ the week is not green; fix before shipping.
- **Purity broken** (core imports I/O) ⇒ stop-the-line; the architecture guarantee is the product's foundation.

## Standing invariants (never violate)
1. The golden fixtures are ground truth — fix code, not tests.
2. `packages/core` stays pure (no I/O/UI/clock/rng).
3. Abbreviated wheels must pass the brute-force cover check before shipping.
4. Prediction is presented as pool-hit-rate analysis, never as a guarantee — the
   lottery is negative-expectation; the tools organize play, not the odds.
5. No proprietary assets copied (`.Wheels`, `.mdb`); regenerate/own everything.

## F1.8 — Results file format (parse/serialize `.Txt`)
> Build this first: everything else needs it. Format (Doc 07 §4.1):
> `M/D/YYYY  NN NN … [BB]` — space-delimited, non-padded date, 2-digit numbers,
> optional trailing bonus column(s).

**User stories**
- *As the system,* I parse a `Drawings/*.Txt` file into `Draw[]` so history loads.
- *As the system,* I serialize `Draw[]` back to the same format so export round-trips.
- *As a maintainer,* malformed lines are reported, not silently dropped.

**Acceptance:** AC-D5. **Module:** `core/game` (`parseDrawings`, `serializeDrawings`).

**Chain**
- **S1 Design:** `parseDrawings(text: string, game: Pick<Game,'pick'|'bonus'>): {draws: Draw[]; errors: {line:number; reason:string}[]}` and `serializeDrawings(draws: Draw[]): string`. Pure.
- **S2 Test:** fixtures = `fixtures/drawings/BrazilMegaSenaBR660.Txt` first 6 lines (Doc 07 §4.1 shows `3/11/1996 04 05 30 33 41 52`) and a Powerball line with trailing bonus. Assert count, first/last draw, bonus split, round-trip `serialize(parse(x)) ≡ x` (modulo whitespace), and that a malformed line yields an error entry not a throw.
- **S3 Implement:** split on whitespace; first token = date; next `pick` tokens = mains; remaining = bonus. Validate counts against the game rules.
- **S4 Integrate:** used by `ResultsRepository` (F1.1/data).
- **S5 Verify:** parse the real Mega-Sena file; print draw count and first/last rows.
- **Quality gate:** template in `../02-conventions.md` with `{{FIXTURES}}`=the two files above, `{{ACCEPTANCE}}`=AC-D5, `{{INTERFACE}}`=the two functions.

"}, {"id": "spec/epics/EPIC-2-statistics.md", "cat": "Clean-Room Engineering Epics", "title": "EPIC 2 — Statistical Analysis Engine", "md": "# EPIC 2 — Statistical Analysis Engine

**Goal:** every one of the 18 methods computes exactly what the original app
computes — proven at ≥98.7% (most 100%) in `../../Documentation/10-Validation-Report.md`.
**Verified source:** Doc 02 (math), Doc 09 §2.2/2.5 (cache schemas), Doc 10 (proof).
**Depends on:** EPIC 1 (`Draw`, `DrawHistory`, `Ctx`). **Phase:** 2.

> **Non-negotiable validated rules — bake into every prompt and test:**
> 1. **Adjacency (Successive, Distance) is computed in DRAW ORDER, not sorted.**
> 2. **Successive-family runs count only if length ≥ 2, else 0.**
> 3. **Average Value & Average Distance use integer FLOOR division.**
> 4. **Root Sum = a SINGLE digit-sum pass** of the total (257→14), not iterated.
> 5. **Low/High split at ⌊M/2⌋** (low = `1..⌊M/2⌋`).
> 6. **Decade = fixed tens** `⌊n/10⌋`.
> Fixtures are ground truth (from the app's own cache tables) — never invent expected values.

**Features:** F2.1 SkipsEngine · F2.2 Counts · F2.3 Sum family · F2.4 AC ·
F2.5 Distance · F2.6 Successive · F2.7 Divided & Multiple · F2.8 Odd-Even/Low-High/Decade ·
F2.9 Units module · F2.10 Hot-Cold/Prior/Locked/Hits · F2.11 Drawings/Distributing ·
F2.12 Statistics UI.

Common fixtures: `fixtures/drawings/*` + the validation tables. A shared golden
fixture `fixtures/stats-golden.json` (export the app's `ComprehensiveAnalyze` +
`UnitsNumbers` + `SumA`, or use the numbers in Doc 10) drives F2.2–F2.9.

---

## F2.1 — SkipsEngine (Actual / Average / Now)
The backbone (Doc 02 \"Skips\"); every method's drill-down and the filters/predictor reuse it.

**User stories** — *As an analyst,* for any tracked value I see its Actual Skips
(gap sequence), Average Skips (mean), and Now Skips (since last hit), and a \"due\"
flag when Now > Average.

**Acceptance:** AC-S7. **Module:** `core/stats/skips`.

**Chain**
- **S1:** `skips(present: boolean[]): { actual: number[]; average: number; now: number }` where `present[i]` = value hit at draw i (chronological). Pure.
- **S2:** fixture from Doc 02 worked example (4-odds: gaps `5,1,2` → avg `8/3`… i.e. `2.67`; now-skips 10 → due). Assert actual gaps, average (float), now, and `due = now > average`.
- **S3:** walk the boolean series; gap = run of falses between trues.
- **S4:** exposed via `analyze()` drill-down (F2.12).
- **S5:** compute skips for \"4 odds\" over a fixture; match Doc 02.
- **Gate:** `{{FIXTURES}}`=Doc 02 skips example; `{{ACCEPTANCE}}`=AC-S7.

---

## F2.2 — Count metrics (Odd / Even / High / Low / Prime)
**User stories** — *As an analyst,* I see per-draw counts of odd, even, high, low, prime numbers.
**Acceptance:** AC-S1, AC-S2 (validated 100%). **Module:** `core/stats/counts`.

**Chain**
- **S1:** `counts(c: number[], M: number): {odd,even,low,high,prime}`.
- **S2:** For Draw D `04 05 30 33 41 52`, M=60: odd 3, even 3, **low 3** (`1..30`, 30 is low), high 3, prime = count in {primes}. Pull more rows from `stats-golden.json`.
- **S3:** floor split `x<=M//2` = low; primes via sieve/set to 90.
- **S4:** columns in the Base tab.
- **S5:** run over the golden set; assert 100% match.
- **Gate:** `{{FIXTURES}}`=stats-golden; `{{ACCEPTANCE}}`=AC-S1/S2.

---

## F2.3 — Sum family
Sum, High/Low/Odd/Even/Prime Sum, Unit Number Sum, **Root Sum (single pass)**, First+Second Unit Sum, Average Value (floor).
**Acceptance:** AC-S1, AC-S5 (Root Sum). Validated 100% (Doc 10). **Module:** `core/stats/sum`.

**Chain**
- **S1:** `sums(c, M): {sum, highSum, lowSum, oddSum, evenSum, primeSum, unitSum, rootSum, firstSecondUnitSum, average}`.
- **S2:** From `SumA` golden rows (Doc 10): e.g. `02 37 38 46 52 55` → sum 230, highSum 228, lowSum 2, primeSum 39, unitSum 30, rootSum(230)=5, firstSecond 50. Add Root-Sum edge: sum 257 → **14** (single pass), sum 165 → **12** (1+6+5), NOT 3.
- **S3:** `rootSum = digits(sum).reduce(+)` ONCE; `average = Math.floor(sum/k)`; `unitSum = Σ (n%10)`; `firstSecond = Σ(⌊n/10⌋) + Σ(n%10)`.
- **S4:** Sum tab columns.
- **S5:** run over `SumA` golden; assert 100%.
- **Gate:** `{{FIXTURES}}`=SumA golden; `{{ACCEPTANCE}}`=AC-S1/S5. Explicitly test Root Sum ≥10 cases.

---

## F2.4 — AC (Arithmetic Complexity)
**Acceptance:** AC-S3. Validated 100%. **Module:** `core/stats/ac`.
**Chain** — S1 `ac(c): number`; S2 fixture `01 05 09 13 18 26 34`→7, plus golden rows; S3 `#{distinct pairwise positive diffs} − (k−1)`; S4 AC tab; S5 golden match. Gate: AC-S3.

---

## F2.5 — Distance family (DRAW ORDER)
First-Last, Max, Average(floor), Different — **all on the numbers as drawn** (absolute adjacent diffs), except First-Last = max−min.
**Acceptance:** AC-S4. Validated 100% (after the draw-order correction). **Module:** `core/stats/distance`.

**Chain**
- **S1:** `distances(drawn: number[]): {firstLast, max, average, different}` — note the input is the **drawn-order** array, not sorted.
- **S2:** golden `Apart` rows; include a case where sorted ≠ drawn order to prove order-sensitivity (Doc 10 example `[5,12,14,32,38,42]` drawn → Max 30, not 18).
- **S3:** `d_i=|a_{i+1}-a_i|` over drawn order; `average=⌊Σd/(k−1)⌋`; `different=|set(d)|`; `firstLast=max−min`.
- **S4:** Distance tab.
- **S5:** golden match 100%.
- **Gate:** `{{ACCEPTANCE}}`=AC-S4. Test MUST include a non-sorted drawn order.

---

## F2.6 — Successive family (DRAW ORDER, ≥2 else 0)
Successive, Successive Groups, Odd Successive, Even Successive.
**Acceptance:** AC-S6. Validated 99.8–100%. **Module:** `core/stats/successive`.

**Chain**
- **S1:** `successive(drawn: number[]): {longest, groups, oddLongest, evenLongest}`.
- **S2:** golden `BeJoined`/`ComprehensiveAnalyze` rows; assert lone number ⇒ 0; runs use draw-order adjacency (`|a_{i+1}-a_i|==1` for integer-consecutive; parity runs = draw-order-adjacent same-parity).
- **S3:** implement per Doc 02 §7 corrected rules; `0` if longest run <2.
- **S4:** Successive columns.
- **S5:** golden match.
- **Gate:** `{{ACCEPTANCE}}`=AC-S6. Test the ≥2 rule and draw-order explicitly.

---

## F2.7 — Divided (÷3–10) & Multiple (÷7·5·3·2·1)
**Acceptance:** AC-X3. Validated 100% (`Residue`, `Multiple`). **Module:** `core/stats/divided`, `core/stats/multiple`.
**Chain** — S1 `divided(c, D): remainderCounts[0..D-1]` and `multiple(c): {m7,m5,m3,m2,m1}` with **priority assignment** (7→5→3→2→1; once assigned, not re-added, e.g. 35→m7); S2 golden `Residue` (÷3) + `Multiple` rows, incl. Modality; S3 per Doc 02 §8/§9; S4 Divided/Multiple tabs; S5 golden match. Gate: AC-X3.

---

## F2.8 — Odd-Even / Low-High / Decade
Counts+sums+Modality; Decade Group Count & Different Decade Count (**fixed tens**).
**Acceptance:** AC-S2. Validated (Decade via shift-corrected 99–100%). **Module:** `core/stats/groups`.
**Chain** — S1 `oddEven(c)`, `lowHigh(c,M)`, `decades(c): {groupCount, differentCount}`; S2 golden `OddEven`/`BigSmall` + Doc 10 decade cases (`[3,5,14,16]`→differentDecade 2, decadeGroups 1 by fixed tens); S3 modality strings + `⌊n/10⌋` decades; S4 tabs; S5 golden match. Gate: AC-S2.

---

## F2.9 — Units module (~30 metrics + 20 digit counts)
The deepest module — **validated 100%** against `UnitsNumbers` (Doc 10).
**Acceptance:** AC-S9. **Module:** `core/stats/units`.

**Chain**
- **S1:** `units(drawn, M): { digitCount[0..9], secondDigitCount[0..9], highUnits, oddUnits, evenUnits, lowest4Units, count123, successivePairedUnits, pairsOddEven, pairsOddOnly, pairsEvenOnly, pairs123, interchangeable, successiveEndUnits, unitSum, unitDifferent, unitGroupCount, sameEndUnitsWithLast }`.
- **S2:** golden `UnitsNumbers` rows (Doc 10 confirmed 100%). Encode the pinned rules as tests: High-Units & Count-1-2-3 **with repeats**; Odd/Even/Lowest-4 **distinct**; **Successive End Units = longest run of consecutive distinct second-digits, ≥2 else 0**; **Same End Units = distinct intersection with prior draw**; **InterChangeable = swap ≤ M, non-palindrome**; unitGroupCount = adjacency groups of distinct second digits.
- **S3:** implement each per Doc 02 §18 corrected definitions.
- **S4:** Units tab (dense grid).
- **S5:** run over the full `UnitsNumbers` golden (100 rows) → 100% match required.
- **Gate:** `{{ACCEPTANCE}}`=AC-S9; **gate fails if any of the 38 columns < 100% on the golden set.**

---

## F2.10 — Hot-Cold / Prior-Draw / Locked / Number-Hits
**Acceptance:** AC-S7, AC-X3. **Module:** `core/stats/frequency`.
**Chain** — S1 `hotCold(history,range)`, `priorDraw(c,history)`, `locked(number,history)`, `numberHits(history)`; S2 goldens `hotcold`,`BeforeDrawings`,`AppearCount`,`NumbersHits` (record the **window** the app used so ranges are exact); S3 per Doc 02 §5/§11/§12/§13; S4 respective tabs; S5 golden match (note prev-draw metrics need same-game ordering). Gate: AC-S7/X3.

---

## F2.11 — Drawings (per-position) & Distributing (trend)
**Acceptance:** AC-X3. **Module:** `core/stats/position`, `core/stats/distributing`.
**Chain** — S1 `perPosition(history)` (counts per column) and `distributing(history): matrix[number 1..M][draw]`; S2 goldens `DrawingsNumber` (Position 1..k) + `DrawingsDistributing` (90 number-columns); S3 per Doc 02 §14/§15; S4 Drawings tab + trend chart; S5 golden match. Gate: AC-X3.

---

## F2.12 — Statistics UI (tabbed workspace)
Screen **S20** (+ S21). Range selector, position selector, click-a-column → skips drill-down.
**User stories** — *As an analyst,* I pick a range and positions, switch method tabs, and click any column to see its Actual/Average/Now skips inline.
**Acceptance:** AC-S8. **Module:** `apps/desktop` route + `ui` charts.

**Chain**
- **S1:** component contract: `<Statistics game history />` renders tabs (AC, Sum, Odd-Even, Low-High, Distance, Divided, Multiple, Prior, Drawings, Distributing, Units, Combo-analyze) each calling the matching core method through an `analyze` use-case.
- **S2 (E2E):** Playwright — change range prev-30, uncheck a position, switch to Sum tab, click Sum column → skips panel shows.
- **S3:** implement tabs + RangeSelector + PositionSelector + SkipsInspector (F8.4).
- **S4:** wire to `app/usecases/analyze`.
- **S5:** launch app, drive the Flow-2 walkthrough (Doc 06).
- **Gate:** `{{ACCEPTANCE}}`=AC-S8; all core methods reachable; changing range/position rescopes only in-scope computation.

### Epic 2 exit criteria
Every method matches its golden fixtures (Units 100%); the Statistics screen drives

in CI.
"}, {"id": "spec/epics/EPIC-3-generation.md", "cat": "Clean-Room Engineering Epics", "title": "EPIC 3 — Ticket Generation", "md": "# EPIC 3 — Ticket Generation

**Goal:** produce a candidate pool of combinations by any of the four modes plus
quick-pick and favorites. **Verified source:** Doc 05 §A, Doc 01 §C. **Depends on:**
EPIC 1 (Game/Ctx), EPIC 5 (WheelLibrary, for F3.4), EPIC 2 (Hot-Cold, for F3.5).
**Phase:** 3.

**Features:** F3.1 Full · F3.2 Positional · F3.3 Random & Smart · F3.4 Wheel ·
F3.5 Quick-pick & favorites · F3.6 Generation UI.

> **Determinism rule:** randomness is injected (`rng: () => number`), never called
> inside pure code, so Random/Smart are testable. Free-edition cap: pool ≤ 10 (EPIC 8).

---

## F3.1 — Full generator
**User stories** — *As a player,* I select a pool of numbers and generate **all**
`C(n,k)` combinations.
**Acceptance:** AC-G1. **Module:** `core/generation/full`.

**Chain**
- **S1:** `full(pool: number[], k: number): Combination[]`.
- **S2:** property test — `full(pool,6).length === C(pool.length,6)`; `pool` of 12 → 924; all lines unique, sorted, subset of pool.
- **S3:** standard k-combination enumeration.
- **S4:** GenerationEngine dispatch (`generate('full', pool)`).
- **S5:** generate 924 from 12 numbers; assert count + uniqueness.
- **Gate:** `{{ACCEPTANCE}}`=AC-G1; property `= C(n,k)` holds for several (n,k).

---

## F3.2 — Positional generator
**User stories** — *As a player,* I set a candidate number set per position and get
the cross-product respecting each slot.
**Acceptance:** AC-G2. **Module:** `core/generation/positional`.

**Chain**
- **S1:** `positional(slots: number[][], opts?): Combination[]` (slot i = allowed numbers for position i).
- **S2:** small slots → exact cross-product; each line respects slot membership; dedupe equal sets if required by config.
- **S3:** cartesian product with validity filter (no repeated number within a line).
- **S4:** `generate('positional', slots)`; screen S01 per-position Pick.
- **S5:** verify cross-product size + slot adherence.
- **Gate:** `{{ACCEPTANCE}}`=AC-G2.

---

## F3.3 — Random & Smart
**User stories** — *As a player,* I generate N random lines; or N \"smart\" lines
weighted by a chosen analysis depth (previous-N window).
**Acceptance:** AC-G5. **Module:** `core/generation/random`.

**Chain**
- **S1:** `random(pool,k,count,rng)`, `smart(pool,k,count,depth,history,rng)`.
- **S2:** with a seeded `rng`, output is deterministic; count + validity correct; smart biases toward frequent numbers in the window (assert distribution over many draws with a fixed seed).
- **S3:** random sampling without replacement per line; smart weights by Hot-Cold over the window (reuse F2.10).
- **S4:** `generate('random'|'smart', …)`; screen S01 mode + depth dropdown.
- **S5:** generate with a seed; show reproducible output.
- **Gate:** `{{ACCEPTANCE}}`=AC-G5; determinism under fixed seed.

---

## F3.4 — Wheel generator
**User stories** — *As a player,* I select a pool and a wheel formula and generate
the wheel's lines with its guarantee.
**Acceptance:** AC-G3. **Module:** `core/generation/wheel` (delegates to EPIC 5 WheelLibrary).

- **S1:** `wheel(pool, formula): { lines: Combination[]; guarantee: GuaranteeReport }`.
- **S2:** 8-number pool, \"pick-6 if-4\" → 7 lines (see EPIC 5 F5.2); instantiation matches the letter map.
- **S3:** call `WheelLibrary.instantiate(wheel, pool)`.
- **S4:** `generate('wheel', pool, {formula})`; screen S01 Wheels radio + formula picker.
- **S5:** generate the 7-line wheel; assert coverage guarantee holds by brute force.
- **Gate:** `{{ACCEPTANCE}}`=AC-G3.

---

## F3.5 — Quick-pick & favorites
**User stories** — *As a player,* one click picks Hot / Cold / Last-N numbers; I
save and reload favorite number sets.
**Acceptance:** AC-G4. **Module:** `core/generation/quickpick` + `SettingsStore` (favorites).

**Chain**
- **S1:** `quickPick(kind: 'hot'|'cold'|'lastN', history, params): number[]`; `saveFavorite(name, set)`, `loadFavorite(name)`.
- **S2:** hot/cold picks equal the Hot-Cold analysis (F2.10) over the same range; favorites round-trip.
- **S3:** thin wrapper over F2.10; favorites via SettingsStore.
- **S4:** screen S43 quick-pick dropdown; Save/Load Selected.
- **S5:** pick hot numbers; confirm they match the Hot-Cold tab.
- **Gate:** `{{ACCEPTANCE}}`=AC-G4.

---

## F3.6 — Generation UI (number grid, modes, bonus)
**User stories** — *As a player,* I select numbers on a grid (selected = highlighted),
choose a mode (Full/Wheels/Positional/Random), toggle bonus, and click Generate to
fill the ticket store.
**Acceptance:** AC-G1..G6. **Module:** `apps/desktop` route S01 + `ui/NumberGrid`.

**Chain**
- **S1:** `<GenerationPanel game />` with NumberGrid, mode radios, bonus toggles, Generate button → `generateTickets` use-case → TicketSet.
- **S2 (E2E):** select 12, Full → store has 924; switch to Wheels → fewer lines.
- **S3:** implement panel + NumberGrid (F8.4); enforce free-edition ≤10 (EPIC 8).
- **S4:** wire to `app/usecases/generateTickets`; result lands in the ticket store (EPIC 7).

All four modes + quick-pick verified; generation fills the ticket store; free-edition

"}, {"id": "spec/epics/EPIC-4-filtering.md", "cat": "Clean-Room Engineering Epics", "title": "EPIC 4 — Filtering Engine (the core value)", "md": "# EPIC 4 — Filtering Engine (the core value)

**Goal:** 69 filters (50 base + 19 advanced), each a predicate over a combination,
combinable by AND / OR / N-of-M, with auto-parameters from history, an assistant,
and a report. **Verified source:** Doc 03, `../../Documentation/filters-catalog.csv`
(tags + default ranges), Doc 09 §DB-1. **Depends on:** EPIC 2 (metrics — filters
reuse them), EPIC 3 (a pool to filter). **Phase:** 4.

**Features:** F4.1 Filter framework · F4.2 Base filters (50) · F4.3 Advanced filters
(19) · F4.4 Logic combinator · F4.5 Auto-parameters · F4.6 Assistant + report ·
F4.7 Filtering UI.

> **Reuse rule:** a filter's metric is the SAME function EPIC 2 already validated —
> never reimplement. A base filter = `metric(combo,ctx) ∈ [min,max]`. Canonical key
> = `Condition_Tag` (1–69); engine type 1=base, 2/3/4=advanced.

---

## F4.1 — Filter framework
**User stories** — *As the system,* I represent any filter as a predicate with a
stable tag, default range, and position scope, and run a pool through a selected set.
**Acceptance:** AC-F1. **Module:** `core/filters/engine`.

**Chain**
- **S1:** types
  ```ts
  interface Filter { tag:number; type:1|2|3|4; name:string;
    metric(c:Combination, ctx:Ctx): number | number[];
    test(c:Combination, ctx:Ctx): boolean; defaultRange:string; positions:number[] }
  interface RunResult { survivors:Combination[]; report:{tag:number; removed:number}[] }
  run(pool:Combination[], filters:Filter[], logic:Logic, ctx:Ctx): RunResult
  type Logic = {kind:'AND'}|{kind:'OR'}|{kind:'NofM'; n:number; m:number}
  ```
- **S2:** given a pool and one filter Number-Sum `120–210`, survivors all have sum ∈ range; removed ones don't; report count matches.
- **S3:** predicate loop + per-filter removed tally.
- **S4:** `app/usecases/runFilters`.
- **S5:** filter a real generated pool; print survivor + removed counts.
- **Gate:** `{{ACCEPTANCE}}`=AC-F1; report counts reconcile with pool reduction.

---

## F4.2 — Base filters (50)
**User stories** — *As a player,* I enable any of the 50 base filters and set a
min–max range (or auto-fill it).
**Acceptance:** AC-F1, AC-F2. **Module:** `core/filters/base` (registry of 50).

**Chain**
- **S1:** a registry mapping each `Condition_Tag` (1–21, 41–69) to `{name, metric}`,
  where `metric` = the EPIC-2 function. Seed names + default ranges from
  `filters-catalog.csv`.
- **S2:** for each tag, a line passing/failing its range is filtered correctly; spot-check tags 1 (Odd 1-5), 6 (Number Sum), 20 (AC 2-6), 68 (Root Sum 4-17), 69 (First+Second 24-60).
- **S3:** wire each tag to its metric (counts F2.2, sums F2.3, ac F2.4, distance F2.5, successive F2.6, units F2.9, etc.).
- **S4:** appears in the Base Filters panel (F4.7).
- **S5:** enable 6 base filters, run, check report.
- **Gate:** `{{ACCEPTANCE}}`=AC-F1/F2; all 50 tags registered and covered by a test.

---

## F4.3 — Advanced filters (19)
Types 2 (bundle: Adv Number Count, Adv Number Sum, Successive-Number), 3 (set: Range,
Number Groups, Must-Contain, Locked, Divided-by-3..10, Multiple, Delete-History,
Hot-Cold), 4 (special: **Difference Filter**, tag 40).
**Acceptance:** AC-F8, AC-F9. **Module:** `core/filters/advanced`.

**Chain**
- **S1:** `AdvancedFilter { tag; conditions: Condition[]; test(c,ctx) }` — a line
  passes iff it satisfies the filter's combined condition set (each type has its own
  combine rule: bundle = all sub-conditions; set = membership-count in range;
  Must-Contain = superset; Locked = ignore lines lacking the locked number;
  Delete-History = not equal to any historical draw; Difference = adjacent/pairwise
  difference constraint).
- **S2:** Range `01-10 allow 0-1`; Number-Groups `{…} 1-2`; Must-Contain `11 25`;
  Locked `02 + {…} 1-2`; Delete-History drops a line equal to a real draw;
  Difference filter constrains diffs (Doc 03 #19; tag 40).
- **S3:** implement each per Doc 03 §Advanced; Difference Filter documented as
  constraining the set of adjacent/pairwise differences (UI-driven param).
- **S4:** Advanced Filters panel (screens S04, Tadv1/2/3).
- **S5:** run 3 advanced filters on a pool; verify.
- **Gate:** `{{ACCEPTANCE}}`=AC-F8/F9; all 19 tags covered; note Difference Filter is
  the 19th (not in the manual — Doc 03/09).

---

## F4.4 — Logic combinator (AND / OR / N-of-M)
**User stories** — *As a player,* I choose how selected filters combine, including a
fault-tolerant \"N-of-M\" that guards against over-filtering the winning line.
**Acceptance:** AC-F3, AC-F4, AC-F5. **Module:** `core/filters/logic`.

**Chain**
- **S1:** `combine(results: boolean[], logic): boolean`.
- **S2:** AND = all; OR = any; `NofM{n,m}` = `n ≤ count(true) ≤ m`. Property: `AND ⇒ OR` (survivor set AND ⊆ OR).
- **S3:** implement; validate n≤m and both within [0, #filters].
- **S4:** logic selector in the filtering panel; persists in settings.
- **S5:** run same filters under AND vs \"3-5\"; compare survivor counts.
- **Gate:** `{{ACCEPTANCE}}`=AC-F3/F4/F5.

---

## F4.5 — Auto-parameter generation
**User stories** — *As a player,* one click fills every base filter's range from the
last N draws (2/3/5/10/20/30/50/current).
**Acceptance:** AC-F2. **Module:** `core/filters/defaults`.

**Chain**
- **S1:** `defaults(filter, history, range): {min,max}` = observed min–max of the filter's metric over the window.
- **S2:** for Odd over a window, range = [minObserved, maxObserved]; matches Doc 03 demo (last-20 Odd → 1-5).
- **S3:** compute metric per draw in window; min/max.
- **S4:** \"Generate Default Condition\" button (range dropdown).
- **S5:** auto-fill on a fixture; spot-check a few ranges.
- **Gate:** `{{ACCEPTANCE}}`=AC-F2; smaller window ⇒ tighter (or equal) range.

---

## F4.6 — Filter assistant + report
**User stories** — *As a player,* each filter shows a frequency + trend chart to set
its range by eye; after filtering I see per-filter removed counts.
**Acceptance:** AC-F6. **Module:** `ui/FrequencyChart`,`ui/TrendChart` + `RunResult.report`.

**Chain** — S1 `<FilterAssistant filter history/>` (freq + trend) and `<FilterReport report/>`; S2 (E2E) open assistant → chart renders; run → report totals reconcile; S3 charts from F8.4 + report from F4.1; S4 screens S06/S08; S5 drive in app. Gate: AC-F6.

---

## F4.7 — Filtering UI
**User stories** — *As a player,* I pick Base/Advanced filters, set logic and position
scope, click Start Filtering, and the pool is cut with a report.
**Acceptance:** AC-F1..F9. **Module:** `apps/desktop` screens S03/S04/S05/S07/S08.

"}, {"id": "spec/epics/EPIC-5-wheeling.md", "cat": "Clean-Room Engineering Epics", "title": "EPIC 5 — Wheeling Systems", "md": "# EPIC 5 — Wheeling Systems

**Goal:** full and abbreviated covering designs with guarantee reporting, regenerated
as our own tables (never copy the proprietary `.Wheels` binaries). **Verified source:**
Doc 04. **Depends on:** EPIC 1 (Game/k). **Phase:** 5. **Consumed by:** EPIC 3 (F3.4).

**Features:** F5.1 Full wheel · F5.2 Abbreviated wheel + guarantee · F5.3 Wheel
library storage · F5.4 Custom wheel + convert-to-wheel · F5.5 Wheeling UI.

> **Separation of concerns:** a wheel is a **letter map** (1-indexed letter combos)
> independent of the numbers; `instantiate(wheel, pool)` substitutes numbers.

---

## F5.1 — Full wheel
**User stories** — *As a player,* a full wheel of my `n` numbers gives all `C(n,k)` lines.
**Acceptance:** AC-W1. **Module:** `core/wheels/full`.

**Chain**
- **S1:** `full(k,n): Wheel` (letter combos = all k-subsets of 1..n); `instantiate(wheel, pool): Combination[]`.
- **S2:** 8/pick-6 → 28; 10 → 210; 12 → 924 (property = C(n,k)); instantiation maps letters→pool[i-1].
- **S3:** k-combination enumeration → letter combos.
- **S4:** GenerationEngine wheel mode.
- **S5:** build + instantiate an 8-number wheel; assert 28 lines.
- **Gate:** `{{ACCEPTANCE}}`=AC-W1.

---

## F5.2 — Abbreviated wheel + guarantee report
**User stories** — *As a player,* an abbreviated wheel gives the minimal lines that
guarantee a stated match tier if X of the winners are in my numbers.
**Acceptance:** AC-W2, AC-W4. **Module:** `core/wheels/abbreviated`.

**Chain**
- **S1:** `abbreviated(k,n,guarantee): Wheel` + `guaranteeReport(wheel): \"if X in pool → Y lines match Z\"`.
- **S2:** 8/pick-6/if-4 → **exactly 7 lines**, and for **every** 4-subset of the 8 there is ≥1 line containing all 4 (brute-force cover check). Guarantee wording matches Doc 04.
- **S3:** use published covering-design tables for common `(k,n,guarantee)`, else a greedy/ILP set-cover solver; store the resulting letter table. **Log any case where the cover is not proven minimal** (no silent claims).
- **S4:** wheel library (F5.3); GenerationEngine.
- **S5:** build the 7-line wheel; run the cover check; print the guarantee report.
- **Gate:** `{{ACCEPTANCE}}`=AC-W2/W4; **gate fails if the cover check finds an uncovered X-subset.**

---

## F5.3 — Wheel library storage + naming
**User stories** — *As the system,* I store wheels keyed by `(k, n, guarantee, variant)`
(the original `PICK-SIZE-GUARANTEE-VARIANT` convention) as our own JSON.
**Acceptance:** AC-W1/W2. **Module:** `core/wheels/library` + `data` (wheel JSON).

**Chain** — S1 `WheelLibrary { get(k,n,guarantee,variant?): Wheel; list(k): WheelMeta[] }`; S2 lookups return correct sizes; S3 JSON tables generated by F5.1/F5.2 (a build script emits them; **no proprietary files copied**); S4 available to generation UI; S5 verify a few lookups. Gate: AC-W1/W2; provenance note: tables are self-generated.

---

## F5.4 — Custom wheel + convert-tickets-to-wheel
**User stories** — *As a power user,* I define a custom wheel; and I convert an
existing ticket set back into a compact wheel structure.
**Acceptance:** AC-W3. **Module:** `core/wheels/custom`.

**Chain** — S1 `custom(letterCombos)`, `ticketsToWheel(tickets): Wheel`; S2 round-trip instantiate(custom)=given lines; convert then instantiate reproduces the set; S3 implement; S4 screen Tcustomwheel + ticket-store menu \"convert to wheel\"; S5 verify round-trip. Gate: AC-W3.

---

## F5.5 — Wheeling UI
**User stories** — *As a player,* I choose a wheel formula for my selected pool and
see its line count and guarantee before generating.
**Acceptance:** AC-W1..W4. **Module:** `apps/desktop` (wheel picker on S01).

**Chain** — S1 `<WheelPicker k pool onSelect/>` showing per-formula line count + guarantee; S2 (E2E) pick \"if-4\" → shows 7 lines + guarantee; S3 build; S4 wire to F3.4; S5 drive in app. Gate: all AC-W*.

### Epic 5 exit criteria
Full counts exact; abbreviated wheels pass the brute-force cover check; guarantee
reports truthful; all tables self-generated (no proprietary `.Wheels`).
"}, {"id": "spec/epics/EPIC-6-prediction.md", "cat": "Clean-Room Engineering Epics", "title": "EPIC 6 — Prediction & Verification", "md": "# EPIC 6 — Prediction & Verification

**Goal:** a predictor that outputs a **recommended number pool** (not a single line)
plus an eliminated set, and an honest **verifier** that replays a formula over
history and measures pool hit-rate. **Verified source:** Doc 05 §B, Doc 09 §2.4
(the pool finding). **Depends on:** EPIC 2 (SkipsEngine, Hot-Cold, trend). **Phase:** 6.

**Features:** F6.1 Predictor · F6.2 Formula strategies (1–6) · F6.3 Verifier ·
F6.4 Drawings Trend · F6.5 Prediction UI.

> **Corrected model (Doc 09 §2.4):** `predict → {recommended[], eliminated[], bonus[]}`
> where `recommended` is ~17–27 numbers; `verify` measures `|recommended ∩ actual|`,
> NOT whether one line won. The internal math of the original Formula-1..6 is
> proprietary and *undocumented* — implement them as pluggable strategies over the
> validated engine and prove value via the verifier. Do not attempt to recover the
> original formulas (out of scope, `_wayfinder/MAP.md`).

---

## F6.1 — Predictor (pool output)
**User stories** — *As a player,* I run a formula and get a recommended pool + an
eliminated set (+ bonus if the game has one), which I can push into the number panel.
**Acceptance:** AC-P1, AC-P2, AC-P5. **Module:** `core/predict/predictor`.

**Chain**
- **S1:** `predict(formula: Formula, ctx: {history, offset, depth}): { recommended:number[]; eliminated:number[]; bonus?:number[] }`. Deterministic (no clock/rng).
- **S2:** same inputs → identical pool (AC-P5); pool ∪ eliminated = full pool 1..M; pool size within a sane band.
- **S3:** a Formula is a strategy: score each number over the window (skips/hot-cold/trend), keep the top band as recommended, rest eliminated.
- **S4:** `app/usecases/predict`; \"add to picking panel\" pushes `recommended` into the grid (EPIC 3).
- **S5:** run Formula-1 on a fixture; print pool + eliminated.
- **Gate:** `{{ACCEPTANCE}}`=AC-P1/P2/P5; pool is a strict subset, deterministic.

---

## F6.2 — Formula strategies (Formula-1 … Formula-6)
**User stories** — *As a player,* I choose among 6 formulas (+ algorithm, offset,
depth) that weight the history differently.
**Acceptance:** AC-P1. **Module:** `core/predict/formulas` (strategy registry).

**Chain**
- **S1:** `Formula { id:1..6; algorithm:number; score(number, ctx): number }`; registry of 6 distinct scorers (e.g. skip-due, hot-window, trend-slope, gap-regression, co-occurrence, blended).
- **S2:** each formula produces a valid pool; different formulas produce different pools on the same input (diversity check).
- **S3:** implement 6 scorers over the validated engine; `offset` shifts the window, `depth` sizes it.
- **S4:** formula/algorithm/offset/depth selectors on screen S30.
- **S5:** run all 6; show pools differ.
- **Gate:** `{{ACCEPTANCE}}`=AC-P1; each formula tested; **none claim to reproduce the original's internal math** (documented as our own strategies).

---

## F6.3 — Verifier (replay → hit-rate)
**User stories** — *As a player,* I verify a formula over a range and see per-draw
hits and a rollup hit-rate, so I can compare formulas honestly.
**Acceptance:** AC-P3, AC-P4. **Module:** `core/predict/verifier`.

**Chain**
- **S1:** `verify(formula, range): { perDraw: {date, actual, pool, correct: number[], correctCount, poolSize}[]; hitRate: number; bonusHitRate?: number }` where `hitRate = Σ correctCount / Σ winners`.
- **S2:** reproduce the shape of the app's `Validation` table (Doc 09 §2.4): e.g. pool of 20, actual `12 15 30 50 65`, correct `12 30 50`, correctCount 3.
- **S3:** for each draw in range, predict as-of that draw (offset), intersect with actual; roll up.
- **S4:** Verification tab on S30 (+ Verification Bonus for bonus games).
- **S5:** verify a formula over the last 100 fixture draws; print per-draw + hit-rate.
- **Gate:** `{{ACCEPTANCE}}`=AC-P3/P4; correctCount = |pool ∩ actual| exactly; bonus reported separately when present.

---

## F6.4 — Drawings Trend (manual prediction)
**User stories** — *As an analyst,* I read a number-movement chart with a \"Next
Drawings\" row and pick the trend-predicted numbers into the panel.
**Acceptance:** AC-P2. **Module:** `ui/TrendChart` + F2.11 distributing.

**Chain** — S1 `<DrawingsTrend history/>` with a next-row picker; S2 (E2E) toggle show/hide, pick all → numbers land in panel; S3 build on distributing (F2.11) + TrendChart (F8.4); S4 screen S20j/manual; S5 drive in app. Gate: AC-P2.

---

## F6.5 — Prediction UI
**User stories** — *As a player,* screen S30 lets me predict, push to panel, and
verify (with bonus), changing the past-draw range.
**Acceptance:** AC-P1..P5. **Module:** `apps/desktop` screen S30.

**Chain** — S1 `<PredictionPanel/>` (Predictor + Verification tabs, formula/algorithm/offset/depth, range); S2 (E2E) Flow-6 (Doc 06); S3 assemble; S4 wire to predict/verify use-cases; S5 drive Flow-6. Gate: all AC-P*.

### Epic 6 exit criteria
Predictor outputs a deterministic pool; 6 formulas distinct; verifier reproduces the
`Validation`-table hit-rate semantics; nothing claims to be the original's secret math.
"}, {"id": "spec/epics/EPIC-7-tickets-lifecycle.md", "cat": "Clean-Room Engineering Epics", "title": "EPIC 7 — Tickets Lifecycle · Optimize · Search · Check-Win", "md": "# EPIC 7 — Tickets Lifecycle · Optimize · Search · Check-Win

**Goal:** the ticket store and everything downstream of it — edit/sort/dedupe/tag,
optimization, combo search, win-checking, and export/print. **Verified source:**
Doc 01 §F, Doc 05 §C/D/E. **Depends on:** EPIC 1–4 (a filtered set). **Phase:** 7.

**Features:** F7.1 TicketSet ops · F7.2 Optimizer · F7.3 Searcher · F7.4 WinChecker ·
F7.5 Export & print · F7.6 Tickets UI.

---

## F7.1 — TicketSet operations
**User stories** — *As a player,* I sort each line low→high, remove duplicates, tag
lines (`X`/blank) and bulk-delete by tag, see a numbers-hit histogram, and 2-/3-combo
frequency across my tickets.
**Acceptance:** AC-T1, AC-T2. **Module:** `core/tickets/set`.

**Chain**
- **S1:** `TicketSet { lines; sortEachLine(); dedupe(); tag(i,t); deleteByTag(t); histogram(): Map<number,number>; comboFreq(size:2|3): Map<combo,count> }`.
- **S2:** sort orders ascending; dedupe leaves a set; histogram sums to `k×#tickets`; comboFreq counts pair/triple occurrences.
- **S3:** immutable ops.
- **S4:** ticket-store menu (screen S02).
- **S5:** load a generated set; sort/dedupe/histogram in the app.
- **Gate:** `{{ACCEPTANCE}}`=AC-T1/T2.

---

## F7.2 — Optimizer (2 strategies)
**User stories** — *As a cost-conscious player,* I reduce a large ticket set by
\"reserve X per 10\" or \"collapse lines sharing X numbers.\"
**Acceptance:** AC-T3, AC-T4. **Module:** `core/tickets/optimizer`.

**Chain**
- **S1:** `optimize(set, strategy: {kind:'reservePerBlock'; x:1..9} | {kind:'sameNumber'; x:number; positions?:number[]}): TicketSet`.
- **S2:** reservePerBlock x=3 → each block of 10 → 3 lines; sameNumber x collapses lines sharing X numbers to one representative.
- **S3:** implement both per Doc 05 §C.
- **S4:** screen S31.
- **S5:** optimize a 60-line set to ~18; verify counts.
- **Gate:** `{{ACCEPTANCE}}`=AC-T3/T4.

---

## F7.3 — Searcher (1/2/3-number combos)
**User stories** — *As an analyst,* I search how often 1/2/3-number combinations
appeared over a range, with appear-count and skips, and the exact draws.
**Acceptance:** AC-T5. **Module:** `core/tickets/searcher` (+ SkipsEngine).

**Chain**
- **S1:** `search(combos, {range, positions}): { combo; appearCount; nowSkips; avgSkips; actualSkips:number[]; hitDraws:string[] }[]`.
- **S2:** reproduce `nsSearch`/`nsStat` semantics (Doc 09 §2.3); auto-generate all 1/2/3 combos; sort by appearCount or nowSkips.
- **S3:** scan history; count + skips per combo (reuse F2.1).
- **S4:** screen S32.
- **S5:** search all 2-number combos over past-260; top pair's hit-draws correct.
- **Gate:** `{{ACCEPTANCE}}`=AC-T5.

---

## F7.4 — WinChecker
**User stories** — *As a player,* after the draw I find all my tickets matching
`=,>,<,≥,≤` a count, bonus-aware.
**Acceptance:** AC-T6. **Module:** `core/tickets/winchecker`.

**Chain**
- **S1:** `check(set, draw, op: '='|'>'|'<'|'>='|'<=', n: number, bonus?: boolean): Ticket[]`.
- **S2:** given draw D and `>=4`, exactly lines sharing ≥4 mains returned; bonus flag also requires bonus match; result annotated `\"m + b\"` like `CheckWinning` (Doc 09).
- **S3:** intersect + compare; bonus handling.
- **S4:** screen S33.
- **S5:** check a set against a known draw; assert the ≥4 set.
- **Gate:** `{{ACCEPTANCE}}`=AC-T6.

---

## F7.5 — Export & print
**User stories** — *As a player,* I export matches/tickets to TXT/HTML/XLSX and print
tickets (columns, title, date).
**Acceptance:** AC-T7. **Module:** `Exporter` port (`data/export`) + screen S40/S41.

**Chain**
- **S1:** port `Exporter { export(rows, format: 'txt'|'html'|'xlsx'): Blob|string }`; print layout `{columns, title?, dateTime?}`.
- **S2:** each format contains identical logical content; TXT round-trips the ticket format (`k`-joined … `tw`, Doc 07 §4.4) if using native format.
- **S3:** implement adapters; print via the shell.
- **S4:** ticket-store + check-win menus.
- **S5:** export a set to all three; open each.
- **Gate:** `{{ACCEPTANCE}}`=AC-T7; formats content-equivalent.

---

## F7.6 — Tickets UI
**User stories** — *As a player,* the ticket store shows my lines with a right-click
menu (sort/dedupe/tag/hits/convert-to-wheel/optimize/save/print/export).
**Acceptance:** AC-T1..T7. **Module:** `apps/desktop` screen S02 (+ S31/S32/S33 links).

**Chain** — S1 `<TicketStore/>` grid + context menu wired to F7.1–F7.5 + F5.4 convert; S2 (E2E) Flow-7/8 (Doc 06); S3 build; S4 wire use-cases; S5 drive Flow-7/8. Gate: all AC-T*.

### Epic 7 exit criteria
Store ops, both optimizers, search, win-check, and 3 export formats verified;
Flow-7 and Flow-8 pass end-to-end.
"}, {"id": "spec/epics/EPIC-8-shell-settings-entitlements.md", "cat": "Clean-Room Engineering Epics", "title": "EPIC 8 — Shell · Settings · Entitlements · Reusable Components", "md": "# EPIC 8 — Shell · Settings · Entitlements · Reusable Components

**Goal:** the app frame that hosts everything — toolbar navigation, persisted
settings, the Free/Pro capability gate, and the shared UI components every screen
reuses. **Verified source:** Doc 00 (edition matrix), Doc 07 §6, Doc 08 (screens).
**Depends on:** nothing to start (F8.1/F8.4 built alongside Phase 1); F8.2/F8.3 as

**Features:** F8.1 App shell + navigation · F8.2 Settings store · F8.3 Entitlements ·

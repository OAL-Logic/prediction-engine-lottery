                \r\n                          \r\n                        \r\n\n| 15. | A | B | E | F | G | H |\n| --- | --- | --- | --- | --- | --- | --- |\n|  | **05** | **09** | **26** | **31** | **37** | **45** |\n| **16.** | **A** | **C** | **D** | **E** | **F** | **G** |\n|  | **05** | **16** | **23** | **26** | **31** | **37** |\n| **17.** | **A** | **C** | **D** | **E** | **F** | **H** |\n|  | **05** | **16** | **23** | **26** | **31** | **45** |\n| **18.** | **A** | **C** | **D** | **E** | **G** | **H** |\n|  | **05** | **16** | **23** | **26** | **37** | **45** |\n| **19.** | **A** | **C** | **D** | **F** | **G** | **H** |\n|  | **05** | **16** | **23** | **31** | **37** | **45** |\n| **20.** | **A** | **C** | **E** | **F** | **G** | **H** |\n|  | **05** | **16** | **26** | **31** | **37** | **45** |\n| **21.** | **A** | **D** | **E** | **F** | **G** | **H** |\n|  | **05** | **23** | **26** | **31** | **37** | **45** |\n| **22.** | **B** | **C** | **D** | **E** | **F** | **G** |\n|  | **09** | **16** | **23** | **26** | **31** | **37** |\n| **23.** | **B** | **C** | **D** | **E** | **F** | **H** |\n|  | **09** | **16** | **23** | **26** | **31** | **45** |\n| **24.** | **B** | **C** | **D** | **E** | **G** | **H** |\n|  | **09** | **16** | **23** | **26** | **37** | **45** |\n| **25.** | **B** | **C** | **D** | **F** | **G** | **H** |\n|  | **09** | **16** | **23** | **31** | **37** | **45** |\n| **26.** | **B** | **C** | **E** | **F** | **G** | **H** |\n|  | **09** | **16** | **26** | **31** | **37** | **45** |\n| **27.** | **B** | **D** | **E** | **F** | **G** | **H** |\n|  | **09** | **23** | **26** | **31** | **37** | **45** |\n| **28.** | **C** | **D** | **E** | **F** | **G** | **H** |\n|  | **16** | **23** | **26** | **31** | **37** | **45** |\n\n\r\n                  \r\n                \r\n              \r\n            \r\n        \r\n      \r\n    \r\n  \r\n  By   playing the 28 combinations in the tables above:  \r\n\n\r\n\n- 05 09 16 23 26 31   \r\n\n- 05 09 16 23 26 37   \r\n\n- 05 09 16 23 26 45   \r\n\n- 05 09 16 23 31 37   \r\n\n- **........**\r\n\n- 09 16 26 31 37 45   \r\n\n- 09 23 26 31 37 45   \r\n\n- 16 23 26 31 37 45 \r\n\n\r\n  If all **6** official   winning numbers are among the 8 numbers wheeled, you are guaranteed to have  \r\n\n\r\n\n- 1 ticket to win the jackpot   \r\n\n- 11 tickets that match 5 of 6   \r\n\n- 16 tickets that match 4 of 6 \r\n\n\r\n  If any **5** of the 6 official winning numbers are among the 8   numbers wheeled, you are guaranteed to have  \r\n\n\r\n\n- 2 tickets that match 5 of 6   \r\n\n- 15 tickets that match 4 of 6   \r\n\n- 11 tickets that match 3 of 6 \r\n\n\r\n  If any **4** of the 6 official winning numbers are among the 8   numbers wheeled, you are guaranteed to have  \r\n\n\r\n\n- 5 tickets that match 4 of 6   \r\n\n- 15 tickets that match 3 of 6 \r\n\n\r\n  If any **3** of the 6 official winning numbers are among the 8   numbers wheeled, you are guaranteed to have  \r\n\n\r\n\n- 9 tickets that match 3 of 6 \r\n\n\r\n\r\n\n  \r\n\n \r\n\n \r\n\n---\n\n---\n\n## Clean-Room Python Boilerplate\n\n```python\nfrom itertools import combinations\n\ndef apply_wheel_template(pool: list[int], index_template: list[list[int]]) -> list[list[int]]:\n    \"\"\"Map a 1-based combinatorial wheel template onto a sorted candidate pool.\"\"\"\n    ordered_pool = sorted(pool)\n    return [sorted(ordered_pool[idx - 1] for idx in row) for row in index_template]\n\ndef verify_wheel_guarantee(\n    tickets: list[list[int]],\n    pool: list[int],\n    draw_hit_count: int,\n    guarantee_tier: int,\n) -> dict[str, int | float]:\n    \"\"\"Verify m-if-t covering guarantee across all C(v, t) possible draw subsets of the pool.\"\"\"\n    ticket_sets = [set(t) for t in tickets]\n    scenarios = list(combinations(pool, draw_hit_count))\n    covered = sum(\n        1 for s in scenarios if any(len(t & set(s)) >= guarantee_tier for t in ticket_sets)\n    )\n    return {\n        \"total_scenarios\": len(scenarios),\n        \"covered_scenarios\": covered,\n        \"coverage_pct\": round(100.0 * covered / max(1, len(scenarios)), 2),\n    }\n```\n"}, {"id": "04-wheeling-systems/how-to-use-ours-wheeling-systems", "title": "How to Use Ours Wheeling Systems", "category": "Combinatorial Wheeling Systems", "folder": "04-wheeling-systems", "rel_path": "manual/04-wheeling-systems/how-to-use-ours-wheeling-systems.md", "body": "# How to Use Ours Wheeling Systems\n\n> **Category:** Combinatorial Wheeling Systems (`04-wheeling-systems`)\n\n## How to Use Ours Wheeling Systems\n\n\r\n\nLottery Analysis Studio support use the wheeling systems to generate tickets, This wheeling system contains over 2200 wheels formulas, support almost all pick 2, pick 3, pick 4, pick 5, pick 6, pick 7 from 1 to 90 numbers, and select max 36 numbers to the wheel.\r\n\n**What is a Wheeling System?**\n\r\n\n\r\nIn short, The wheeling system is a reduced form of the complete number combinations. It provides the most efficient coverage for the numbers you choose to play, and it gives you an assurance of winning for each wheel. You do not have to bet on all combinations of your chosen numbers.\r\n\n**The following information is from Wikipedia**\n\r\n\n\r\nLottery wheeling (also known as a lottery system, lottery wheel, lottery wheeling system) is an entertaining strategy of playing the lotteries, widely used by individual players and syndicates to secure wins provided they hit some of the drawn numbers. It allows playing with more than one ticket and more numbers than those drawn in the lottery. For more information, please visit Wikipedia.\n\r\n\n\r\n**How to Use Lottery Studio’s Wheeling Systems?**\n\r\n\n\r\nFor example, see the screenshot below, in the following Powerball lottery, choose 10 numbers to the wheel, we choose the formula “if 5 matches 4” instead of purchasing 252 combinations, you only bet on 17 tickets, and if the winning numbers are among those 10 numbers, it guarantees you win a 4-number prize and several 3-number and 4-number prizes. The odds of winning 5 numbers is 6.75%. If you’re really lucky, you hit the jackpot. (If you want to generate complete combinations, please use the Full Generator.).\r\n\n\r\n\n---\n\n---\n\n## Clean-Room Python Boilerplate\n\n```python\nfrom itertools import combinations\n\ndef apply_wheel_template(pool: list[int], index_template: list[list[int]]) -> list[list[int]]:\n    \"\"\"Map a 1-based combinatorial wheel template onto a sorted candidate pool.\"\"\"\n    ordered_pool = sorted(pool)\n    return [sorted(ordered_pool[idx - 1] for idx in row) for row in index_template]\n\ndef verify_wheel_guarantee(\n    tickets: list[list[int]],\n    pool: list[int],\n    draw_hit_count: int,\n    guarantee_tier: int,\n) -> dict[str, int | float]:\n    \"\"\"Verify m-if-t covering guarantee across all C(v, t) possible draw subsets of the pool.\"\"\"\n    ticket_sets = [set(t) for t in tickets]\n    scenarios = list(combinations(pool, draw_hit_count))\n    covered = sum(\n        1 for s in scenarios if any(len(t & set(s)) >= guarantee_tier for t in ticket_sets)\n    )\n    return {\n        \"total_scenarios\": len(scenarios),\n        \"covered_scenarios\": covered,\n        \"coverage_pct\": round(100.0 * covered / max(1, len(scenarios)), 2),\n    }\n```\n"}, {"id": "04-wheeling-systems/wheeling-types", "title": "Wheeling Types", "category": "Combinatorial Wheeling Systems", "folder": "04-wheeling-systems", "rel_path": "manual/04-wheeling-systems/wheeling-types.md", "body": "# Wheeling Types\n\n> **Category:** Combinatorial Wheeling Systems (`04-wheeling-systems`)\n\n## Wheeling Types\n\n\r\n\nIn choosing the best type of wheeling system for you, you have three choices: \r\n\n\r\n\n- Full wheel   \r\n\n- Abbreviated wheel\n\r\n\n\r\n\n\r\n  **Full Wheel**\n\r\n\n  \r\n  A full wheel always contains All of the possible combinations that may be made with the audience of numbers you select. For instance, the sample wheel around the previous page is really a full wheel for the Pick 6 lotto game, wheeling eight numbers in 28 possible combinations.\n\r\nThe objective of the full wheel is to provide you with the best possible shot in a jackpot and multiple lower prizes. \r\n\nBenefits of Full Wheel: Playing a complete wheel gives you maximum coverage from the prizes if some or all of the winning numbers are in the numbers you wheeled. If all of the winning numbers have been in the audience you wheeled, you're certain to win the jackpot and multiple second and third prizes. Even though you only have a few of the winning numbers in your wheel, you are certain to have multiple winning tickets. For instance, in our sample wheel, if you have only four winning numbers out of the eight you wheeled, you are guaranteed to have five tickets that match four of six numbers and 15 tickets that match three of six. \r\n\nDrawbacks of Full Wheel: To put it simply, it isn't cheap if you wish to wheel large amounts of numbers. For instance: \r\n\n\r\n\n- A 9 numbers full wheel for a Pick 6 lotto game contains 84 combinations.   \r\n\n- A 10 numbers full wheel for a Pick 6 lotto game contains 210 combinations.   \r\n\n- A 11 numbers full wheel for a Pick 6 lotto game contains 462 combinations.   \r\n\n- A 12 numbers full wheel for a Pick 6 lotto game contains 924 combinations.   \r\n\n- A 13 numbers full wheel for a Pick 6 lotto game contains 1716 combinations.   \r\n\n- A 14 numbers full wheel for a Pick 6 lotto game contains 3003 combinations.   \r\n\n- A 15 numbers full wheel for a Pick 6 lotto game contains 5005 combinations. \r\n\n\r\n\n \r\n\n**Abbreviated Wheel**\n\r\n\n\r\nAn Abbreviated Wheel is a set of minimum combination that guarantees you a win   whenever you match a specified amount of the winning numbers. Below you see an   example of an Abbreviated Wheel for a Pick 6 lotto game.   It wheels 8 numbers in 7   combinations. If 4 of the 6   winning numbers are among the 8 numbers you wheel, then   you are guaranteed to have at least one successful   combination matching 4 winning numbers.\n\r\n\n\r\n\r\n\r\n  \r\n    \r\n      \r\n        \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n              \r\n              \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n              \r\n            \r\n\n| **A** | **B** | **C** | **D** | **E** | **F** | **G** | **H** |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n\n\r\n        \r\n      \r\n    \r\n  \r\n\r\n\n\r\n\r\n  \r\n    \r\n      \r\n        \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n              \r\n              \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n              \r\n              \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n              \r\n              \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n              \r\n              \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n              \r\n              \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n              \r\n              \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n                \r\n              \r\n              \r\n                \r\n                \r\n ed. By being   able to play more numbers, you greatly increase your chances of having more   winning numbers fall into your wheel and cashing in winning tickets!   \r\n\n**Drawbacks of Abbreviated Wheel:** Even if all the winning numbers fall   into your wheel, you're not guaranteed winning a jackpot. However, you could   still win multiple prizes, even the jackpot - it's just not guaranteed. \r\n\n---\n\n---\n\n## Clean-Room Python Boilerplate\n\n```python\nfrom itertools import combinations\n\ndef apply_wheel_template(pool: list[int], index_template: list[list[int]]) -> list[list[int]]:\n    \"\"\"Map a 1-based combinatorial wheel template onto a sorted candidate pool.\"\"\"\n    ordered_pool = sorted(pool)\n    return [sorted(ordered_pool[idx - 1] for idx in row) for row in index_template]\n\ndef verify_wheel_guarantee(\n    tickets: list[list[int]],\n    pool: list[int],\n    draw_hit_count: int,\n    guarantee_tier: int,\n) -> dict[str, int | float]:\n    \"\"\"Verify m-if-t covering guarantee across all C(v, t) possible draw subsets of the pool.\"\"\"\n    ticket_sets = [set(t) for t in tickets]\n    scenarios = list(combinations(pool, draw_hit_count))\n    covered = sum(\n        1 for s in scenarios if any(len(t & set(s)) >= guarantee_tier for t in ticket_sets)\n    )\n    return {\n        \"total_scenarios\": len(scenarios),\n        \"covered_scenarios\": covered,\n        \"coverage_pct\": round(100.0 * covered / max(1, len(scenarios)), 2),\n    }\n```\n"}, {"id": "04-wheeling-systems/why-use-wheeling-systems", "title": "Why Use Wheeling Systems", "category": "Combinatorial Wheeling Systems", "folder": "04-wheeling-systems", "rel_path": "manual/04-wheeling-systems/why-use-wheeling-systems.md", "body": "# Why Use Wheeling Systems\n\n> **Category:** Combinatorial Wheeling Systems (`04-wheeling-systems`)\n\n## Why Use Wheeling Systems\n\n\r\n\nSuccessful lottery players realize that a Wheeling System is a way of organizing your lotto-type game play to enhan function renderMarkdown(md) {
  let html = md
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  html = html.replace(/```([a-z]*)[\r\n]+([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code}</code></pre>`);
  html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/^- (.*)$/gm, "<li>$1</li>");
  html = html.replace(/\n\n/g, "<br><br>");
  return html;
}

function computeSandbox() {
  const raw = document.getElementById("ticketInput").value.trim();
  const nums = raw.split(/[\s,;-]+/).map(Number).filter(n => !isNaN(n) && n > 0);
  const box = document.getElementById("sandboxMetrics");
  if (nums.length < 2) {
    box.innerHTML = "<span class='metric-pill'>Enter at least 2 numbers</span>";
    return;
  }
  const k = nums.length;
  const sum = nums.reduce((a, b) => a + b, 0);
  const avg = Math.floor(sum / k);
  const odds = nums.filter(n => n % 2 !== 0).length;
  const evens = k - odds;
  const diffs = new Set();
  for (let i = 0; i < k; i++) {
    for (let j = i + 1; j < k; j++) diffs.add(Math.abs(nums[i] - nums[j]));
  }
  const ac = diffs.size - (k - 1);
  const span = Math.max(...nums) - Math.min(...nums);
  const decades = new Set(nums.map(n => Math.floor(n / 10))).size;
  box.innerHTML = `
    <span class="metric-pill">Sum: <strong>${sum}</strong></span>
    <span class="metric-pill">Floor Avg: <strong>${avg}</strong></span>
    <span class="metric-pill">AC Value: <strong>${ac}</strong></span>
    <span class="metric-pill">Odd/Even: <strong>${odds}:${evens}</strong></span>
    <span class="metric-pill">Spread: <strong>${span}</strong></span>
    <span class="metric-pill">Decades: <strong>${decades}</strong></span>
  `;
}

const catSelect = document.getElementById("catSelect");
const categories = [...new Set(DOCS.map(d => d.category))];
categories.forEach(c => {
  const opt = document.createElement("option");
  opt.value = c;
  opt.textContent = c;
  catSelect.appendChild(opt);
});

let activeId = DOCS[0]?.id;

function renderList() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const cat = catSelect.value;
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  const filtered = DOCS.filter(d => {
    if (cat !== "ALL" && d.category !== cat) return false;
    if (!q) return true;
    return d.title.toLowerCase().includes(q) || d.body.toLowerCase().includes(q);
  });
  filtered.forEach(d => {
    const div = document.createElement("div");
    div.className = "nav-item" + (d.id === activeId ? " active" : "");
    div.innerHTML = `<span class="nav-cat">${d.category}</span>${d.title}`;
    div.onclick = () => selectDoc(d.id);
    nav.appendChild(div);
  });
}

function selectDoc(id) {
  activeId = id;
  const doc = DOCS.find(d => d.id === id) || DOCS[0];
  if (doc) {
    document.getElementById("doc-viewer").innerHTML = renderMarkdown(doc.body);
  }
  renderList();
}

document.getElementById("searchInput").oninput = renderList;
catSelect.onchange = renderList;
document.getElementById("ticketInput").oninput = computeSandbox;
computeSandbox();
selectDoc(activeId);
</script>

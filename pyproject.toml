[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery-engine"
version = "11.2.0"
description = "High-performance lottery prediction engine — 100+ CLI commands, 80+ strategies, FastAPI sidecar, Go gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lottery", "statistics", "analysis", "mega-sena", "powerball"]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "numexpr>=2.10.2",
    "bottleneck>=1.4.2",
    "scipy>=1.13",          # chi-squared test in frequency module
    "httpx>=0.27",          # async-friendly HTTP for adapters
    "typer>=0.12",          # CLI
    "rich>=13",             # pretty CLI output
    "PyYAML>=6.0",          # registry configuration
    "duckdb>=1.0",          # high-performance local analytical database
    "mcp[cli]",             # Model Context Protocol
    "fastmcp",              # High-level MCP server framework
    "astropy>=6.0",         # High-precision astronomical calculations
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",          # gradient_boost strategy
    "xgboost>=2.0",
    "catboost>=1.2",
]
deep = [
    "torch>=2.3",
    "pytorch-crf>=0.7",
]
all = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "torch>=2.3",
    "pytorch-crf>=0.7",
    "xgboost>=2.0",
    "catboost>=1.2",
    "PySide6>=6.7",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "websockets>=12.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
desktop = [
    "PySide6>=6.7",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "websockets>=12.0",
]

[project.scripts]
lottery = "engine.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

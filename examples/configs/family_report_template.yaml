# Family High-Performance Report 📄
# Optimized for Mega-Sena and Lotofácil with Narrative Storytelling.

name: "Family Strategic Portfolio"

steps:
  - type: fetch
    lottery: br/mega-sena
  - type: fetch
    lottery: br/lotofacil

  - type: narrative
    name: "Mega-Sena Strategic Story"
    lottery: br/mega-sena
    persona: "Synapse Architect"
    output: "reports/br/mega-sena/story.example.md"

  - type: suggest
    name: "Mega-Sena Bayesian Elite"
    lottery: "br/mega-sena"
    limit: 150
    count: 7
    temperature: 0.7
    strategies:
      - name: "bayesian"
    output: "reports/br/mega-sena/strategy-bayesian.md"

  - type: narrative
    name: "Lotofácil Intelligence Story"
    lottery: br/lotofacil
    persona: "Chaos Oracle"
    output: "reports/br/lotofacil/story.example.md"

  - type: suggest
    name: "Lotofácil Random Forest Intelligence"
    lottery: "br/lotofacil"
    limit: 500
    count: 7
    temperature: 0.7
    strategies:
      - name: "random_forest"
    output: "reports/br/lotofacil/strategy-random-forest.md"

  - type: suggest
    name: "Lotofácil Steiner Wheel (7+ Coverage)"
    lottery: "br/lotofacil"
    strategies:
      - name: "steiner_wheel"
        params:
          pool_size: 21
          match_guarantee: 14
    count: 10
    output: "reports/br/lotofacil/strategy-steiner-wheel.md"

  - type: suggest
    name: "Personalized Kabbalistic (Vibrational)"
    lottery: "br/lotofacil"
    count: 7
    temperature: 0.8
    strategies:
      - name: "kabbalistic"
    output: "reports/br/lotofacil/strategy-kabbalistic.md"
